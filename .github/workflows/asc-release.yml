name: App Store release step

# One App Store Connect step for one app's version that is being prepared or reviewed (.github/scripts/asc_release.py):
# status (read only), cancel review, attach a build, update the texts from a JSON file in this repository, submit for review.
# Started by hand, one step per run, so each change is seen before the next (owner, 2026-10-12: cancel the Dictionary's
# review, new screenshots, the new build and texts, then submit again).
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app'
        type: choice
        options: [dict, uposatha, dg, safari]
        default: dict
      action:
        description: 'status (read only) / testflight (read only: groups, public link, builds) / beta (a build to the external TestFlight groups and Apple beta review) / screens (read only: the version screenshots, as an artifact) / cancel / set-build / set-text / submit'
        type: choice
        options: [status, testflight, screens, cancel, set-build, set-text, screenshots, delete-locale, submit, beta]
        default: status
      arg:
        description: 'beta: "<build number>|<What to Test>"; set-build: the build number; set-text: the JSON file (e.g. dict/store/listing.json); screenshots: TYPE=dir (e.g. APP_IPHONE_69=dict/store/iphone69), replaces that set in en-US'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: asc-release
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ${{ inputs.action }} (${{ inputs.app }})
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP: ${{ inputs.app }}
          ACTION: ${{ inputs.action }}
          ARG: ${{ inputs.arg }}
        run: |
          pip install --quiet 'pyjwt[crypto]' cryptography
          case "$APP" in dict) B=gift.dhamma.pali; ID=6816639947 ;; uposatha) B=gift.dhamma.uposatha; ID=6816601259 ;; dg) B=gift.dhamma.mobile; ID= ;; safari) B=gift.dhamma.dictlookup; ID=; export ASC_PLATFORM=MAC_OS ;; esac
          if [ "$ACTION" = screenshots ]; then
            # The committed pictures of one display type (the owner's own, from a phone), replacing that set; never submits.
            python3 dict/tools/asc-screenshots.py --app-id "$ID" --version 1.0 --locale en-US --set "$ARG" | tee step.txt
          else
            python3 .github/scripts/asc_release.py "$B" "$ACTION" ${ARG:+"$ARG"} | tee step.txt
          fi
          { echo "### App Store: $ACTION ($APP)"; echo '```'; cat step.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The screenshots (screens)
        if: inputs.action == 'screens'
        uses: actions/upload-artifact@v4
        with:
          name: asc-screens-${{ inputs.app }}
          path: screens/
