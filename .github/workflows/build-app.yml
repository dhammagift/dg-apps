      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # App Store screenshots for the dictionary (test/ios-sim/tour.js + drive.sh): the same page the APK ships, walked
  # through its views on an iPhone 6.5" and an iPad 13" simulator. Started with `screenshots`, like the other two apps'
  # screenshot jobs; uploaded to the listing unless screenshots_local, never sent for review.
  dict-ios-screenshots:
    name: Dictionary app iOS screenshots
    needs: dict-build
    if: inputs.screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the web bundle
        uses: actions/download-artifact@v4
        with:
          name: dict-www-${{ github.run_number }}
          path: dict/www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
