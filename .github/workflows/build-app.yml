name: Build App

# Builds the offline SQLite databases + the Android APK entirely on GitHub's runner — the prod
# server has no disk headroom for this (core.db+lang_ru.db+lang_en.db alone are ~260MB, plus
# Gradle/Android SDK caches).
#
# THE UI IS NOT IN THIS REPOSITORY. It is generated at build time from a dg-node checkout:
# build-page.js turns dg-node's search/index.html into www/index.html, build-assets.js copies
# every asset that page references, build-toc-snapshot.js snapshots a running dg-fastify.js.
# Which dg-node commit is used is pinned by the DG_NODE_REF file at this repo's root (a full commit
# SHA; DICT_UI_REF pins ddg-ui the same way), overridable per-run via the workflow_dispatch input
# below. The `plan` job resolves both to commits once, every job of the run checks out exactly those,
# and the run summary and the release notes name them.
#
# dg-node has many git-tracked RELATIVE symlinks (reader/images/*.png, reader/css/index.css,
# siteroot/*, ...) that assume the exact prod directory depth:
#   /var/www/html/                    <- dhammagift/dg      (legacy PHP repo)
#   /var/www/html/nodejs/             <- dhammagift/dg-node (the website)
# A relative syhmlink resolves against the REAL (kernel-canonicalized) path, not any alias on top
# of it — so checking dg-node out somewhere else and symlink-ALIASING /var/www/html/nodejs to it
# does NOT make those symlinks resolve: Node's readdirSync/copyFileSync/__dirname all see the real
# underlying path. Both repos therefore land at their real absolute prod paths below, and
# DG_NODE_PATH points this repo's build scripts at that location (see paths.js).
#h
# sc-data and offline-data don't have this problem: they're referenced only through
# nodejs/siteroot/data/{suttacentral.net,dhammagift}, which this workflow force-replaces with
# hand-made ABSOLUTE symlinks anyway — independent of checkout path depth, so they stay under the
# workspace-relative repos/ for simplicity.
#
# Checkout order matters: dg (legacy) MUST land first, since dg-node's target is nested inside it
# (/var/www/html/nodejs) — git clean would otherwise wipe a sibling checkout that arrived first.
#
# All repos are public, so no token needed for the checkouts.

on:
  # A tag builds. Run workflow builds. A push does not.
  #
  # It used to build on EVERY push to every branch, on the reasoning that then there is always an
  # installable APK without tagging anything. That reasoning costs the better part of an hour and a
  # 213MB database each time: six runs queued on one branch in a single morning, four of them for
  # commits that touched nothing but .md files, sitting in front of the runs another branch was
  # waiting on (owner: "зачем любой пуш запускает сборку.... это же бред" — and, on a README fix,
  # "зачем сборка"). Narrowing it to "pushes that can change the package" was still the wrong
  # shape: work in progress does not need a build at all. It needs one when someone asks.
  #
  # So: a tag is a release and always builds; Actions → Build App → Run workflow builds any branch
  # on demand, with the same artifacts. Nothing else starts a run.
  #
  # A tag releases ONE app, to both its stores (owner: never ship an app nobody asked for): dg-v* is
  # Dhamma.Gift, dict-v* the dictionary, upo-v* Uposatha. A plain v* tag is Dhamma.Gift, which is what
  # a tag meant before the other two apps existed (v1.16.0). Any other tag starts nothing.
  #
  # The cost, stated rather than discovered later: main is no longer checked automatically by the
  # e2e steps below. Whoever merges something worth checking presses Run workflow — or we add a
  # light job that runs the checks without building the database, which is the expensive half.
  push:
    tags:
      - 'v*'
      - 'dg-v*'
      - 'dict-v*'
      - 'upo-v*'
  workflow_dispatch:
    inputs:
      dg_node_ref:
        description: 'dg-node branch, tag or full commit SHA to build the UI from (default: the commit in DG_NODE_REF)'
        required: false
        type: string
      online_origin:
        description: 'Site the app talks to (default: dhamma.gift; https://test.dhamma.gift to try unreleased site changes; a store release refuses anything but https://dhamma.gift)'
        required: false
        type: string
      release:
        description: 'Which store gets this build, one app at a time (owner, 2026-09-29: the same shape for all three apps, and never ship an app nobody asked for). dg = Dhamma.Gift to Play (closed testing, alpha; production still needs a promote in the console); dg-ios = Dhamma.Gift to TestFlight; dg-both = Dhamma.Gift to both, in one run; dict / dict-ios = the dictionary to Play (closed testing, alpha) / TestFlight; uposatha / uposatha-ios = Uposatha to Play (closed testing, alpha) / TestFlight. none (default) = build only, nothing uploaded. A dict/uposatha choice skips the Dhamma.Gift build (and its database) entirely. A store release runs only from main (or a tag) with the site at https://dhamma.gift, and waits for that app''s checks. A tag releases one app to both stores: dg-v* (or a plain v*) Dhamma.Gift, dict-v* the dictionary, upo-v* Uposatha.'
        required: false
        type: choice
        default: none
        options: [none, dg, dg-ios, dg-both, dict, dict-ios, uposatha, uposatha-ios]
      ios_checks:
        description: 'Also run the iOS check jobs (simulator build, UI checks). Off by default: a manual run is usually about the Android half, and they only add minutes of waiting after it. A TestFlight release (dg-ios, dg-both, uposatha-ios, a tag) always runs its app''s checks and waits for them.'
        required: false
        type: boolean
        default: false
      screenshots:
        description: 'Take the App Store screenshots (all three apps; the Dictionary and Uposatha sets are also uploaded to their App Store Connect listings, never sent for review). Only on request (owner, 2026-09-30: once, when a listing needs new pictures — not on every run, not on a tag).'
        required: false
        type: boolean
        default: false
      screenshots_local:
        description: 'With screenshots: keep the Uposatha pictures in the workflow artifact only, nothing goes to App Store Connect (to look at the app without touching the listing)'
        required: false
        type: boolean
        default: false
      video:
        description: 'Record the emulator test as a video (flow.mp4) as well as screenshots'
        required: false
        type: boolean
        default: false
      ios_video:
        description: 'Record the iOS simulator check as a video (ios-flow.mp4) as well as screenshots (dg-apps#41: edge to edge, to be looked at without a phone)'
        required: false
        type: boolean
        default: false
      uposatha:
        description: 'Build the Uposatha APK (debug and release, uploaded nowhere) and run its iOS simulator check, without Dhamma.Gift''s iOS checks: a manual run for a test build. release=uposatha / ios_checks build it too.'
        required: false
        type: boolean
        default: false
      keep_ipa:
        description: 'Also archive and sign a Dhamma.Gift IPA and keep it as an artifact, so ios-upload.yml can send this very build to TestFlight later (runs the iOS checks too). Off by default; dg-ios, dg-both and a Dhamma.Gift tag always make one.'
        required: false
        type: boolean
        default: false
      dict_only:
        description: 'Run ONLY the dictionary app jobs and skip Dhamma.Gift entirely. For checking a change under dict/ without building the offline library: minutes instead of the better part of an hour. A tag ignores it.'
        required: false
        type: boolean
        default: false

# One build per branch. A new push supersedes the one still running on the same ref rather than
# queueing behind it: the older run was going to produce an APK nobody would install anyway, and
# the queue is shared with every other branch. Tags are exempt — a release run must never be
# cancelled by whatever is pushed next.
concurrency:
  # The dictionary/Uposatha-only run (dict_only) has a group of its own: it takes minutes, the full run takes
  # the better part of an hour, and starting the quick one must not cancel the full one that is running.
  #
  # The release target is part of the name too (owner, 2026-10-01: "как uposatha android может пострадать от
  # dg apple"). Without it every manual run on a branch lands in the same group, so a Dhamma.Gift iOS release
  # cancelled an Uposatha Android build that had nothing to do with it — not a dependency, just the same
  # group string. Same target still cancels itself (that is what cancel-in-progress is for); different apps
  # or stores no longer touch each other.
  group: build-${{ github.ref }}-${{ inputs.dict_only && 'small' || 'full' }}-${{ inputs.release || 'none' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default. The one job that writes (the GitHub release on a Dhamma.Gift tag) asks for it
# itself, so the long build job — which runs npm packages of dg-node, the app and Playwright — holds no
# token that could push to this repository.
permissions:
  contents: read

env:
  # Builds talk to dhamma.gift (owner, 2026-09-15: the site's app layer is deployed to prod). For
  # unreleased site changes run the workflow by hand with online_origin=https://test.dhamma.gift.
  DG_ONLINE_ORIGIN: ${{ inputs.online_origin || 'https://dhamma.gift' }}
  REPOS_ROOT: ${{ github.workspace }}/repos
  DG_NODE_PATH: /var/www/html/nodejs
  # Port dg-fastify.js is started on for the TOC snapshot — see that step for why it is pinned.
  DG_SERVER_PORT: '3000'

jobs:
  # ---------------------------------------------------------------------------------------------
  # What this run is: the dg-node and ddg-ui commits it builds from, and which app goes to which store.
  # Decided once, here, and read by every job below as needs.plan.outputs.*, rather than as a dozen
  # copies of the same expression over inputs and github.ref that had already drifted apart (the
  # comment on Uposatha's release said a tag did not touch it, the condition below it said it did).
  #
  # Commits, not branch names: DG_NODE_REF / DICT_UI_REF hold full SHAs, and a branch or tag given
  # as dg_node_ref is turned into one here. Every job then fetches that exact commit, so the
  # Dhamma.Gift and the Uposatha halves of one run can no longer get two different dg-node mains.
  #
  # The guard for store uploads lives here too, so a release that cannot go anyway fails in seconds
  # instead of after the build: only from main or a tag, and only with the app talking to the real
  # site. A test build (release=none) is never stopped by it.
  plan:
    name: Plan (pinned commits, what this run releases)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dg_node_sha: ${{ steps.pin.outputs.dg_node_sha }}
      ddg_ui_sha: ${{ steps.pin.outputs.ddg_ui_sha }}
      build_dg: ${{ steps.what.outputs.build_dg }}
      dg_android_tests: ${{ steps.what.outputs.dg_android_tests }}
      dg_ios_checks: ${{ steps.what.outputs.dg_ios_checks }}
      dg_ios_archive: ${{ steps.what.outputs.dg_ios_archive }}
      dg_play: ${{ steps.what.outputs.dg_play }}
      dg_ios: ${{ steps.what.outputs.dg_ios }}
      github_release: ${{ steps.what.outputs.github_release }}
      build_dict: ${{ steps.what.outputs.build_dict }}
      dict_launch: ${{ steps.what.outputs.dict_launch }}
      dict_play: ${{ steps.what.outputs.dict_play }}
      dict_ios: ${{ steps.what.outputs.dict_ios }}
      build_upo: ${{ steps.what.outputs.build_upo }}
      upo_launch: ${{ steps.what.outputs.upo_launch }}
      upo_ios_checks: ${{ steps.what.outputs.upo_ios_checks }}
      upo_play: ${{ steps.what.outputs.upo_play }}
      upo_ios: ${{ steps.what.outputs.upo_ios }}
      dg_number: ${{ steps.num.outputs.dg_number }}
      dict_number: ${{ steps.num.outputs.dict_number }}
      uposatha_number: ${{ steps.num.outputs.uposatha_number }}
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve dg-node and ddg-ui to commits
        id: pin
        env:
          DG_NODE_INPUT: ${{ inputs.dg_node_ref }}
        run: |
          set -euo pipefail
          resolve() {  # <repo> <branch | tag | full commit sha>
            if [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then echo "$2"; return 0; fi
            local out sha
            out=$(git ls-remote "https://github.com/dhammagift/$1.git" "refs/heads/$2" "refs/tags/$2" "refs/tags/$2^{}")
            sha=$(awk '/\^\{\}$/ { print $1; exit }' <<< "$out")   # an annotated tag: the commit it points at
            [ -n "$sha" ] || sha=$(awk 'NR == 1 { print $1 }' <<< "$out")
            [ -n "$sha" ] && echo "$sha"
          }
          NODE_REF="${DG_NODE_INPUT:-$(tr -d '[:space:]' < DG_NODE_REF)}"
          UI_REF="$(tr -d '[:space:]' < DICT_UI_REF)"
          [ -n "$NODE_REF" ] || { echo "::error::DG_NODE_REF is empty and no dg_node_ref input given"; exit 1; }
          [ -n "$UI_REF" ] || { echo "::error::DICT_UI_REF is empty"; exit 1; }
          NODE_SHA=$(resolve dg-node "$NODE_REF") || { echo "::error::dg-node has no branch or tag '$NODE_REF' (a commit must be the full 40-character SHA)"; exit 1; }
          UI_SHA=$(resolve ddg-ui "$UI_REF") || { echo "::error::ddg-ui has no branch or tag '$UI_REF'"; exit 1; }
          echo "dg_node_sha=$NODE_SHA" >> "$GITHUB_OUTPUT"
          echo "ddg_ui_sha=$UI_SHA" >> "$GITHUB_OUTPUT"
          echo "dg-node: $NODE_REF = $NODE_SHA"
          echo "ddg-ui:  $UI_REF = $UI_SHA"
          {
            echo "### Built from"
            echo ""
            echo "| | commit |"
            echo "|---|---|"
            echo "| dg-apps | \`$GITHUB_SHA\` ($GITHUB_REF_NAME) |"
            echo "| dg-node | \`$NODE_SHA\` (from \`$NODE_REF\`) |"
            echo "| ddg-ui | \`$UI_SHA\` (from \`$UI_REF\`) |"
            echo ""
            echo "Site the apps talk to: $DG_ONLINE_ORIGIN"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # A push only ever arrives here as one of the tag patterns under `on:`; a dispatch says what it
      # wants in its inputs. Every output is the string true or false.
      - name: Decide what this run builds and releases
        id: what
        env:
          RELEASE: ${{ inputs.release }}
          IOS_CHECKS: ${{ inputs.ios_checks }}
          UPOSATHA: ${{ inputs.uposatha }}
          DICT_ONLY: ${{ inputs.dict_only }}
          KEEP_IPA: ${{ inputs.keep_ipa }}
        run: |
          set -euo pipefail
          app=""; stores=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF_NAME" in
              dict-v*) app=dict ;;
              upo-v*)  app=uposatha ;;
              dg-v*|v*) app=dg ;;
              *) echo "::error::tag $GITHUB_REF_NAME names no app (dg-v*, dict-v*, upo-v*; a plain v* is Dhamma.Gift)"; exit 1 ;;
            esac
            stores="play ios"
          else
            case "${RELEASE:-}" in
              dg) app=dg; stores=play ;;
              dg-ios) app=dg; stores=ios ;;
              dg-both) app=dg; stores="play ios" ;;
              dict) app=dict; stores=play ;;
              dict-ios) app=dict; stores=ios ;;
              uposatha) app=uposatha; stores=play ;;
              uposatha-ios) app=uposatha; stores=ios ;;
            esac
          fi
          yes() { "$@" && echo true || echo false; }
          to() { [ "$app" = "$1" ] && [[ " $stores " == *" $2 "* ]]; }
          on() { [ "${1:-}" = true ]; }
          dg_play=$(yes to dg play); dg_ios=$(yes to dg ios)
          dict_play=$(yes to dict play); dict_ios=$(yes to dict ios)
          upo_play=$(yes to uposatha play); upo_ios=$(yes to uposatha ios)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            build_dg=$(yes [ "$app" = dg ]); build_dict=$(yes [ "$app" = dict ]); build_upo=$(yes [ "$app" = uposatha ])
            dg_android_tests=$build_dg
          else
            # As before: a dictionary-only run or a dictionary/Uposatha release skips Dhamma.Gift and its database,
            # and an iOS-only release skips the Android emulator suite.
            build_dg=$(yes eval '! on "${DICT_ONLY:-}" && [ "$app" != dict ] && [ "$app" != uposatha ]')
            build_dict=$(yes eval 'on "${DICT_ONLY:-}" || [ "$app" = dict ]')
            build_upo=$(yes eval '[ "$app" = uposatha ] || on "${IOS_CHECKS:-}" || on "${UPOSATHA:-}"')
            dg_android_tests=$(yes eval '[ "$build_dg" = true ] && [[ "${RELEASE:-}" != *-ios ]]')
          fi
          # An IPA is made only when someone will send it: TestFlight now, or ios-upload.yml later (keep_ipa).
          dg_ios_archive=$(yes eval '[ "$build_dg" = true ] && { [ "$dg_ios" = true ] || on "${KEEP_IPA:-}"; }')
          # The iOS checks run for every IPA, so nothing reaches TestFlight, now or later, without them.
          dg_ios_checks=$(yes eval 'on "${IOS_CHECKS:-}" || [ "$dg_ios_archive" = true ]')
          upo_ios_checks=$(yes eval 'on "${IOS_CHECKS:-}" || on "${UPOSATHA:-}" || [ "$upo_ios" = true ]')
          # The emulator launch checks: before every Play upload, and on the test runs of that app so they are known to work.
          dict_launch=$(yes eval '[ "$build_dict" = true ] && { [ "$dict_play" = true ] || on "${DICT_ONLY:-}"; }')
          upo_launch=$(yes eval '[ "$build_upo" = true ] && { [ "$upo_play" = true ] || on "${UPOSATHA:-}"; }')
          github_release=$(yes eval '[ "$GITHUB_EVENT_NAME" = push ] && [ "$app" = dg ]')
          for v in build_dg dg_android_tests dg_ios_checks dg_ios_archive dg_play dg_ios github_release \
                   build_dict dict_launch dict_play dict_ios build_upo upo_launch upo_ios_checks upo_play upo_ios; do
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
            echo "$v=${!v}"
          done
          uploads=""
          for v in dg_play dg_ios dict_play dict_ios upo_play upo_ios; do [ "${!v}" = true ] && uploads="$uploads $v"; done
          echo "uploads=$uploads" >> "$GITHUB_OUTPUT"
          if [ -z "$uploads" ]; then
            echo "Nothing from this run goes to a store." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Store uploads:$uploads (each waits for its app's checks)" >> "$GITHUB_STEP_SUMMARY"
          # The guard (verified 2026-10-10: Uposatha 488 went to Play from a FAILED run of a feature branch on 2026-10-03,
          # and nothing would have stopped a build talking to test.dhamma.gift either).
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/*) ;;
            *) echo "::error::a store release runs only from main or a tag, not $GITHUB_REF (release=none builds any branch)"; exit 1 ;;
          esac
          if [ "$DG_ONLINE_ORIGIN" != https://dhamma.gift ]; then
            echo "::error::a store release talks to https://dhamma.gift, not $DG_ONLINE_ORIGIN (online_origin is for test builds)"; exit 1
          fi

      # Each app's build number (versionCode / CFBundleVersion): its own counter, read from the stores and the
      # app's version.properties (build_floor), not the run number. The rule is in .github/scripts/build_numbers.py.
      # A store this run uploads to must answer, or the run stops here instead of at the upload an hour later.
      - name: Build numbers (one counter per app)
        id: num
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MUST_READ: ${{ steps.what.outputs.uploads }}
        run: |
          set -euo pipefail
          pip install --quiet google-api-python-client google-auth 'pyjwt[crypto]'
          python3 .github/scripts/build_numbers.py | tee -a "$GITHUB_OUTPUT"
          { echo ""; echo "Build numbers: $(grep -h _number= "$GITHUB_OUTPUT" | tr '\n' ' ')"; } >> "$GITHUB_STEP_SUMMARY"

      # What play-upload.yml and ios-upload.yml check before they send this run's files anywhere later.
      - name: Write down what this run is
        env:
          DG_NODE_SHA: ${{ steps.pin.outputs.dg_node_sha }}
          DDG_UI_SHA: ${{ steps.pin.outputs.ddg_ui_sha }}
          DG_NUMBER: ${{ steps.num.outputs.dg_number }}
          DICT_NUMBER: ${{ steps.num.outputs.dict_number }}
          UPOSATHA_NUMBER: ${{ steps.num.outputs.uposatha_number }}
        run: |
          python3 - <<'EOF'
          import json, os
          e = os.environ
          json.dump({'run_number': int(e['GITHUB_RUN_NUMBER']), 'ref': e['GITHUB_REF'], 'sha': e['GITHUB_SHA'],
                     'dg_node': e['DG_NODE_SHA'], 'ddg_ui': e['DDG_UI_SHA'], 'online_origin': e['DG_ONLINE_ORIGIN'],
                     'build_numbers': {a: int(e[a.upper() + '_NUMBER']) for a in ('dg', 'dict', 'uposatha')}},
                    open('build-info.json', 'w'), indent=2)
          EOF
          cat build-info.json

      - name: Keep it with the run
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.run_number }}
          path: build-info.json
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The checks that need nothing but node: no device, no database, no built bundle. Every run, and
  # every store upload waits for them. (The browser checks of each app's built page run in that app's
  # build job, where the page is: build, dict-build, uposatha-build.)
  unit:
    name: Unit checks (node only)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      # The code that replaces an installed app's files with the site's (src/site-updater.js): gate closed = nothing applied,
      # a changed file = handed over, one failed fetch = nothing applied.
      - name: Check the site updater
        run: node test/site-updater.test.js

      # The dhammagift:// contract, checked as pure string work: every documented form and every documented refusal. It is
      # the test for Android and iOS at once, because both hand the same raw URL to the same mapping (src/deep-link.js).
      - name: Check the deep-link contract
        run: node test/deep-link.test.js

      # The per-app build number rule (plan's "Build numbers" step) against fake store answers.
      - name: Check the build-number rule
        run: python3 .github/scripts/build_numbers.py --self-test

      # One version per app (version.properties), read by gradle and passed to xcodebuild. The Xcode project still carries
      # MARKETING_VERSION for a build from Xcode on a Mac; it must say the same, or a local build and CI would disagree.
      - name: Check the iOS projects carry the version in version.properties
        run: |
          set -euo pipefail
          for app in . dict uposatha; do
            v=$(sed -n 's/^ios=//p' "$app/version.properties")
            [ -n "$v" ] || v=$(sed -n 's/^version=//p' "$app/version.properties")
            [ -n "$v" ] || { echo "::error::$app/version.properties has no version="; exit 1; }
            bad=$(grep -oE 'MARKETING_VERSION = [^;]+' "$app/ios/App/App.xcodeproj/project.pbxproj" | sort -u | grep -vxF "MARKETING_VERSION = $v" || true)
            [ -z "$bad" ] || { echo "::error::$app: the Xcode project says '$bad', version.properties says $v"; exit 1; }
            echo "$app: android $(sed -n 's/^version=//p' "$app/version.properties"), ios $v"
          done

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The dict_only dispatch input skips this job and everything that needs it (android-release,
    # the three iOS jobs, ios-release): a change under dict/ has nothing to do with the offline
    # library this job builds, and waiting an hour to find out would be the wrong price.
    # Also skipped when only the dictionary or Uposatha is being released (or tagged): neither needs it.
    if: needs.plan.outputs.build_dg == 'true'
    # Read-only (the workflow default). The GitHub release of a tag is made by the small
    # github-release job below, the only one with contents: write.
    outputs:
      app_version: ${{ steps.appver.outputs.name }}
      cert: ${{ steps.sig.outputs.cert }}

    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Read once, near the top, so both the artifact names and the release job can use it.
      - name: Read app version
        id: appver
        run: |
          name=$(sed -n 's/^version=//p' version.properties)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Prepare workspace layout
        run: |
          sudo mkdir -p /var/www/html
          sudo chown -R "$(id -u):$(id -g)" /var/www/html
          mkdir -p "$REPOS_ROOT/sc-data"
          mkdir -p "$REPOS_ROOT/offline-data"

      - name: Configure git safe directories
        run: |
          git config --global --add safe.directory /var/www/html
          git config --global --add safe.directory /var/www/html/nodejs
          git config --global --add safe.directory "$REPOS_ROOT/sc-data"
          git config --global --add safe.directory "$REPOS_ROOT/offline-data"

      # actions/checkout@v4 REFUSES any `path:` outside $GITHUB_WORKSPACE ("Repository path
      # '/var/www/html' is not under ...") with no supported override, and these two must land at
      # the real prod paths (see header). Plain git has no such restriction.
      #
      # "read" is checked out alongside assets/* — reader/css/index.css's relative symlink needs
      # /var/www/html/read/css/index.css to exist.
      - name: Checkout legacy dg (the asset trees the app copies)
        working-directory: /var/www/html
        run: |
          git init -q
          git remote add origin https://github.com/dhammagift/dg.git
          git config core.sparseCheckout true
          git sparse-checkout init --cone
          # build-assets.js copies whole trees (ASSET_TREES/ASSET_LOOSE_FILES) for the pages the
          # app's menu links to — common/, grammar/, materials/, diff/, repeat-timer/ — and
          # verifies afterwards that every referenced file is in www/. A tree that this checkout
          # does not fetch is therefore a hard build failure, not a warning: that is exactly how
          # the first CI run of this workflow failed (assets/common and assets/grammar were
          # missing and the verification listed the History page and the grammar pages as
          # unreachable). Keep this list in step with build-assets.js.
          git sparse-checkout set \
            assets/img assets/css assets/js assets/svg assets/texts \
            assets/common assets/grammar assets/materials assets/diff assets/repeat-timer \
            read
          git fetch --depth 1 origin main -q
          git checkout -q FETCH_HEAD

      # By the commit the plan job resolved. (An anonymous `git fetch origin <full-sha>` once
      # answered HTTP 401 here; it works on these public repos now — checked 2026-10-10 for the tip
      # of main and for an older commit.)
      - name: Checkout dg-node (the website — source of the UI)
        env:
          DG_NODE_SHA: ${{ needs.plan.outputs.dg_node_sha }}
        run: |
          mkdir -p "$DG_NODE_PATH"
          cd "$DG_NODE_PATH"
          git init -q
          git remote add origin https://github.com/dhammagift/dg-node.git
          git fetch --depth 1 origin "$DG_NODE_SHA" -q
          git checkout -q FETCH_HEAD
          echo "dg-node = $(git rev-parse HEAD)"

      # structure/tree is NOT optional — dg-fastify.js's TOC_TREE_ROOT reads
      # .../sc-data/structure/tree/{sutta,vinaya,abhidhamma}/{code}-tree.json for every single
      # /api/toc/book/:code request. Missing it doesn't error at checkout time (sc_bilara_data
      # alone builds a perfectly valid skeleton/offline-db) — every book lookup just 404s at
      # request time instead, which is exactly what once silently broke the TOC snapshot 46/46.
      - name: Checkout SuttaCentral bilara data (public, root/variant/html/translation only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: suttacentral/sc-data
          path: repos/sc-data
          sparse-checkout: |
            sc_bilara_data
            structure
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Checkout DhammaGift offline translations
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: dhammagift/offline-data
          path: repos/offline-data
          sparse-checkout: |
            dhammagift
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Create symlink structure for sc-data/offline-data
        run: |
          # NOTE: /var/www/html/suttacentral.net is deliberately NOT created here. The legacy dg
          # checkout (previous step) already brought it in as a git-tracked symlink pointing at
          # ../suttacentral.net — cone-mode sparse-checkout always includes root-level entries,
          # symlinks included, whatever the sparse dir list says. It therefore already IS an alias
          # for /var/www/suttacentral.net created below, and `mkdir -p` on it fails with "File
          # exists" (the directory entry exists even while its target does not). Only the real
          # target needs creating; the alias resolves through it, so sc-data needs no second
          # symlink under /var/www/html either.
          sudo mkdir -p /var/www/suttacentral.net
          sudo mkdir -p /var/www/offline-data
          sudo mkdir -p /offline-data

          sudo rm -f /var/www/suttacentral.net/sc-data || true
          sudo rm -f /var/www/offline-data/dhammagift || true
          sudo rm -f /offline-data/dhammagift || true

          # dblight.js / dg-light.js / lib/translation-sources.js all read from
          # .../suttacentral.net/sc-data/sc_bilara_data (prod has a real sc-data/ directory there).
          # Symlink the CHECKED-OUT sc-data dir itself — not its sc_bilara_data subfolder — one
          # level up so that "sc-data" path segment resolves. Placed under both /var/www/html and
          # /var/www so either relative layout works.
          sudo ln -s "$REPOS_ROOT/sc-data" /var/www/suttacentral.net/sc-data
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /var/www/offline-data/dhammagift
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /offline-data/dhammagift

          sudo chown -R "$(id -u):$(id -g)" /var/www/suttacentral.net /var/www/offline-data /offline-data || true

          # Replace the placeholder files that stand in for relative symlink targets in the
          # checked-out dg-node with real absolute symlinks — the same treatment prod gives
          # siteroot/data/<site>.
          DG_NODE_DATA="$DG_NODE_PATH/siteroot/data"
          sudo rm -rf "$DG_NODE_DATA/suttacentral.net" || true
          sudo ln -s /var/www/suttacentral.net "$DG_NODE_DATA/suttacentral.net"
          sudo rm -rf "$DG_NODE_DATA/dhammagift" || true
          sudo ln -s /offline-data/dhammagift "$DG_NODE_DATA/dhammagift"
          sudo chown -R "$(id -u):$(id -g)" "$DG_NODE_DATA" || true
          readlink -f "$DG_NODE_DATA/suttacentral.net" || true

      - name: Verify data layout resolves
        working-directory: /var/www/html/nodejs
        run: |
          test -d siteroot/data/suttacentral.net/sc-data/sc_bilara_data/root || { echo "::error::sc-data did not land where siteroot/data/suttacentral.net/sc-data expects it"; exit 1; }
          test -d siteroot/data/suttacentral.net/sc-data/structure/tree/sutta || { echo "::error::sc-data's structure/tree missing — every /api/toc/book/:code request 404s without it (TOC_TREE_ROOT in dg-fastify.js)"; exit 1; }
          test -d siteroot/data/dhammagift/translation/en || { echo "::error::offline-data did not land where siteroot/data/dhammagift expects it"; exit 1; }
          test -f /var/www/html/assets/js/textinfo.json || { echo "::error::legacy assets/js missing (textinfo.json) — build-search-db.js needs it"; exit 1; }
          test -f reader/images/favicon-name-black.png || { echo "::error::reader/images relative symlink didn't resolve — dg and dg-node must be checked out at their real absolute prod paths (see workflow header)"; exit 1; }
          test -f reader/css/index.css || { echo "::error::reader/css/index.css relative symlink didn't resolve — needs /var/www/html/read/css/index.css, check dg's sparse-checkout includes 'read'"; exit 1; }
          echo "Data layout OK."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      # Only npm's download cache, never node_modules: a restored node_modules of dg-node (whose lock file
      # is outside the workspace, so no key could see it) or of an older Node could be stale without anyone
      # noticing, and an exact key hit never refreshed it. ~/.npm is content-addressed, so restoring an
      # older one is always safe; the installs below then lay node_modules out from the lock files.
      - name: Restore the npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-24.20.0-${{ hashFiles('package-lock.json') }}-${{ needs.plan.outputs.dg_node_sha }}
          restore-keys: |
            ${{ runner.os }}-npm-24.20.0-

      # `cache: gradle` works here but did NOT in dg-node's version of this workflow: setup-java's
      # gradle-file glob (like hashFiles()) refuses to look outside $GITHUB_WORKSPACE, and there
      # the Android project lived under /var/www/html/nodejs/mobile — outside it. In this repo
      # android/ IS the workspace, so the cache is simply available. A small dividend of the split.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'  # Capacitor 8 (AGP 8.13) needs JDK 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default package list includes the legacy "tools" package, which Google has
          # dropped from the SDK repository (sdkmanager: "Failed to find package 'tools'"), so the
          # step failed. Install only what the build needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dg-node dependencies
        working-directory: /var/www/html/nodejs
        run: npm install --legacy-peer-deps --no-audit

      - name: Install app dependencies
        run: npm ci --no-audit

      # public/overrides/js/fontawesome-local.js is gitignored in dg-node and generated from its
      # @fortawesome devDependency. dg-node's own CI never ran this, so every APK it produced
      # shipped without the icon bundle — build-assets.js reported it as MISSING and carried on.
      - name: Build dg-node icon bundle (fontawesome-local.js)
        working-directory: /var/www/html/nodejs
        run: npm run build-icons

      # The app no longer builds a database of its own. dg-node builds dg.db from the corpus —
      # the same file the site queries — and the app cuts a language slice out of it. That is
      # what makes the two provably the same data rather than two readings of the same files.
      - name: Build dg.db (dg-node)
        working-directory: /var/www/html/nodejs
        run: npm run build-search-db

      # The offline layer (fetch shim, data worker, core bundle, sqlite-wasm) is built in dg-node and
      # copied into the app verbatim — see docs/OFFLINE_PWA_PLAN.md, "Этап 2". Building it here rather
      # than in the app is what keeps one core bundle for the site, the PWA and the app: the app's own
      # build-core-bundle.js is gone, and build-assets.js fails loudly if this step did not run.
      - name: Build the offline layer (dg-node)
        working-directory: /var/www/html/nodejs
        run: npm run build-offline

      # dg-fastify.js is what prod actually runs (dg-light.js was its predecessor, replaced there
      # entirely) — using it here too, not dg-light.js, means the TOC snapshot and the generated
      # settings/*.json files this build bakes in come from the SAME code path that answers the
      # live site, not a second, unmaintained implementation that can silently drift from it.
      # It needs dg.db to boot (throws if missing) — already built two steps above — which is also
      # why dblight.js's dg_db_light.json skeleton is gone from this workflow entirely: dg-fastify
      # reads its own skeleton out of dg.db directly, that file was only ever dg-light.js's input.
      #
      # app.listen() accepts connections immediately, while its async initServer()
      # (buildSettingsDemoCache — Aksharamukha conversion for every script — then
      # buildScriptListCache/buildLangCountsCache/buildTranslatorCatalogCache) keeps running in
      # the background and writes settings/{scripts,demo-data,lang-counts,translator-catalog}.json
      # only once done. Measured on dg-light.js: /api/toc answers in ~6s but translator-catalog.
      # json — the LAST file in that sequence — doesn't land until ~36s; killing the server before
      # then froze initServer() mid-way and left "Build assets" with permanently missing inputs.
      # Waiting on translator-catalog.json, not just /api/toc, closes that window — dg-fastify.js
      # runs the identical four functions in the identical order, so the same wait applies.
      #
      # PORT is set explicitly rather than relying on the default: dg-fastify.js's own default
      # (3000) happens to already match DG_SERVER_PORT, but pinning it here makes that agreement
      # explicit instead of coincidental.
      - name: Start dg-fastify.js (for the TOC snapshot and the generated settings files)
        working-directory: /var/www/html/nodejs
        env:
          PORT: ${{ env.DG_SERVER_PORT }}
        run: |
          npm run start:fastify > /tmp/dg-fastify.log 2>&1 &
          echo $! > /tmp/dg-fastify.pid
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:$PORT/api/toc" > /dev/null 2>&1 && [ -f settings/translator-catalog.json ]; then
              echo "dg-fastify.js is up on port $PORT and fully initialized (attempt $i)."
              exit 0
            fi
            echo "Attempt $i/45..."
            sleep 2
          done
          echo "::error::dg-fastify.js did not become fully ready within 90s on port $PORT"
          cat /tmp/dg-fastify.log
          exit 1

      # MUST run after dg-fastify.js has booted at least once: settings/{scripts,demo-data,
      # lang-counts,translator-catalog}.json are gitignored and written by the server at startup,
      # so on a fresh checkout they don't exist until it has run.
      #
      # The bundle is built in TWO phases on purpose, with the TOC snapshot in between: the page
      # first (build-page.js — dg-node's search/index.html with the native platform and bridge
      # injected), then the snapshot, then build-assets.js. build-assets.js refuses to run without
      # www/api-snapshots/toc.json now — the navigator answers /api/toc from it, and when it went
      # missing the app showed "Failed to load TOC: /api/toc: HTTP 404" on a device.
      - name: Build the page (www/index.html)
        run: node build-page.js

      - name: Snapshot the offline TOC (needs dg-fastify.js from the previous step)
        run: npm run build-toc-snapshot -- --base=http://localhost:${{ env.DG_SERVER_PORT }}

      - name: Build web assets (www/**)
        run: node build-assets.js
        env:
          # Goes into www/app-version.json, i.e. the "App version" row — the same number gradle
          # gets as -PdgVersionCode below (see build-assets.js's writeAppVersion): Dhamma.Gift's build
          # number from the plan job, not the run number.
          DG_VERSION_CODE: ${{ needs.plan.outputs.dg_number }}

      # The iOS job (bottom of this file) builds and tests the SAME bundle on a macOS runner. It
      # must not re-run this whole pipeline — the expensive part is dg-node's dg.db and the
      # dg-fastify boot, neither of which iOS needs (the app downloads dg.db at runtime, and the
      # simulator test uses the small fixture). So the bundle is passed across as an artifact, the
      # same bytes the Android APK is built from and the browser checks just ran against.
      # Uploaded here, immediately after the build, so a later failing check still leaves the
      # artifact for an ios-build run that is deliberately allowed to run on its result.
      - name: Upload the built web bundle (for the iOS job)
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www/
          retention-days: 1
          if-no-files-found: error



      # The checks that run against the BUILT page in a real browser. They belong here and not
      # only on a workstation: the app once shipped with its data worker dead — every search and
      # every reader request failing on the device — because these ran in one place and CI ran
      # none of them. test/serve-local.js is deliberately no more permissive about MIME types than
      # Capacitor's asset server, so a module that would not load on a phone does not load here.
      # Used to rely on ubuntu-latest's pre-installed /usr/bin/google-chrome instead of installing
      # one — worked for months, then this exact step started failing this check near-instantly
      # (page errors, no diff output) with no code change anywhere near it, timing consistent with
      # chromium.launch() itself throwing rather than anything in the page. A system browser
      # nobody here pins the version of is exactly the kind of thing a runner-image update changes
      # out from under a workflow without any warning. `playwright install` pins an EXACT Chromium
      # build matched to this playwright-core version instead, the same guarantee build-app.yml
      # already gives every other dependency (npm's lockfile, DG_NODE_REF, the JDK/SDK versions).
      # (The dhammagift:// contract itself, test/deep-link.test.js, needs nothing but node: it runs
      # in the unit job.)
      # The browsers are the same bytes for one Playwright version, so they are kept between runs, keyed by that version (the
      # system libraries --with-deps adds still come from apt each time). The version is the one pinned in the step below.
      - name: Restore the Playwright browsers
        uses: actions/cache@v4
        with:
          path: /opt/pw-browsers
          key: ${{ runner.os }}-pw-1.49.1-chromium-webkit

      - name: Install a browser driver for the end-to-end checks
        # 40-170 s normally; run 429 hung here for 40 min (a stuck download on the runner) with nothing
        # to stop it but the 6-hour job limit. Each try is capped, and a second one follows a hang.
        timeout-minutes: 12
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          npm install --no-save playwright-core@1.49.1
          # webkit as well as chromium: the deep-link check below runs in both engines. Not because a
          # Linux WebKit is iOS (it is not — the simulator job tests the real WKWebView), but because
          # the same mapping and handoff are engine-independent code, and this is the cheapest place
          # to notice WebKit-only breakage in them.
          # The CLI's `install` subcommand lives in the "playwright" package, not the
          # library-only "playwright-core" this repo actually requires at runtime (confirmed
          # locally: `npx --package=playwright-core ... playwright install` fails instantly with
          # "playwright: not found" — playwright-core ships no such binary at all). Same version
          # pin either way, so both packages agree on which Chromium revision to fetch/resolve.
          timeout 300 npx --yes playwright@1.49.1 install --with-deps chromium webkit \
            || timeout 300 npx --yes playwright@1.49.1 install --with-deps chromium webkit

      # The app's own rows on the built pages, with Capacitor mocked and the real src/native-bridge.js:
      # the rating invitation (when it shows, when it must not) and the launcher-shortcut sets the
      # settings switch pushes. These tests load Playwright from the path it has on the dev server
      # (/usr/lib/node_modules/@playwright/cli/...), so that path is pointed at the copy installed above.
      # (test/rate-us-ui.js and test/launch-screens-ui.js fail on main as it is — expectations older
      # than the iOS App Store id and the launch screens — and are not run until they are brought up to date.)
      - name: Check the rating invitation and the launcher-shortcut sets (built page, a browser)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
          DG_SHOTS: ${{ runner.temp }}/dg-shots
        run: |
          sudo mkdir -p /usr/lib/node_modules/@playwright/cli/node_modules
          sudo ln -sfn "$GITHUB_WORKSPACE/node_modules/playwright-core" /usr/lib/node_modules/@playwright/cli/node_modules/playwright
          mkdir -p "$DG_SHOTS"
          node test/rate-prompt-ui.js
          node test/shortcuts-ui.js

      # The app's own checks, run in dg-node against the server that is already up: every bundled
      # page compared with the live site (the "tile opens the search page" family — a missing path
      # is not a 404 in a WebView, it is index.html), and no referenced-but-absent file.
      - name: Check the app's pages against the site
        env:
          DG_APP_PATH: ${{ github.workspace }}
          DG_SITE_URL: http://localhost:${{ env.DG_SERVER_PORT }}
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        working-directory: /var/www/html/nodejs
        run: |
          node test/app-ui/check-pages.js
          node test/app-ui/check-assets.js

      # The parity reference: what THIS server answers, on the dg.db this run publishes below. The
      # committed test/snapshots/site came from a 2026-09-05 fixture database and no longer matched.
      - name: Capture the site's answers (parity reference)
        run: node test/capture.js --base=http://localhost:${{ env.DG_SERVER_PORT }} --out=test/snapshots/site

      # Universal Links need this file served from the domain root, with no redirect and as
      # application/json — Apple rejects a redirect or a wrong Content-Type, which is exactly what a
      # generic static mount would produce. The Android counterpart (assetlinks.json) has its own
      # route; this checks the iOS one while the server is still up.
      - name: Check the Apple association file is served
        run: |
          set -o pipefail
          CT=$(curl -sS -o /tmp/aasa.json -w '%{content_type}' "http://localhost:${{ env.DG_SERVER_PORT }}/.well-known/apple-app-site-association")
          echo "content-type: $CT"
          case "$CT" in application/json*) ;; *) echo "::error::iOS rejects a wrong Content-Type for the association file ($CT)"; exit 1;; esac
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('/tmp/aasa.json'))
          ids = d['applinks']['details'][0]['appIDs']
          if not ids or not ids[0].endswith('.gift.dhamma.mobile'):
              sys.exit(f"::error::unexpected appIDs: {ids}")
          print('appIDs:', ids)
          if ids[0].startswith('TEAMID.'):
              print('::warning::the team id is still the placeholder — fill configs/apple-app-site-association before the first signed build')
          EOF

      # Only now: the page checks above compare the app against this server, and the TOC snapshot
      # came from it. Stopping it earlier left the checks with nothing to compare against.
      - name: Stop dg-fastify.js
        if: always()
        run: |
          if [ -f /tmp/dg-fastify.pid ]; then
            PID=$(cat /tmp/dg-fastify.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi


      # The offline library: the dg.db built above, published as dg.db.gz + db-manifest.json exactly
      # like prod (--no-build: no second build). It is BOTH what the browser checks below download
      # and what this run uploads, so the thing tested and the thing shipped are the same file.
      - name: Publish the offline library (dg-node)
        working-directory: /var/www/html/nodejs
        run: node build-search-db.js --no-build

      - name: List the offline library
        working-directory: /var/www/html/nodejs
        run: ls -lah siteroot/mobile-data/ || { echo "::error::publishing the offline library produced nothing"; exit 1; }

      # The checks below run on the database this run built, but a phone downloads the one the site
      # publishes ($DG_ONLINE_ORIGIN/mobile-data). If dg-node changed the schema and the site has not
      # republished yet (or the other way round), every check here is green and offline search is broken
      # on every device. So the two must agree on what the app's code depends on: schema and FTS tokenizer.
      - name: The site's published library has the schema this build expects
        working-directory: /var/www/html/nodejs
        run: |
          set -euo pipefail
          curl -sSf --retry 3 --max-time 30 "$DG_ONLINE_ORIGIN/mobile-data/db-manifest.json" -o /tmp/site-manifest.json \
            || { echo "::error::$DG_ONLINE_ORIGIN/mobile-data/db-manifest.json did not answer: the app would have no library to download"; exit 1; }
          python3 - siteroot/mobile-data/db-manifest.json /tmp/site-manifest.json <<'EOF'
          import json, sys
          built, site = (json.load(open(f)) for f in sys.argv[1:3])
          bad = [k for k in ('schema_version', 'fts') if built.get(k) != site.get(k)]
          for k in ('schema_version', 'fts', 'build_id', 'built_at'):
              print(f"{k:15} built here: {built.get(k)!s:28} published: {site.get(k)}")
          if bad:
              print("::error::the published library differs in " + ", ".join(bad) + ": the app built here would fail on the database phones download")
              sys.exit(1)
          EOF

      - name: Serve the built app and its database
        run: |
          node test/serve-local.js www /var/www/html/nodejs/siteroot/mobile-data 8097 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8097/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8097/ >/dev/null || { echo "::error::the local test server never came up"; exit 1; }

      # Every /search, /api/text and /api/nav answer diffed against the snapshots captured from
      # the live site, plus the guard that the gear opens Settings rather than searching for the
      # word "settings".
      - name: Check the app answers exactly like the site
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        # pipefail: without it `| tee` reported success whatever e2e-browser.js returned, so a DIFF
        # never failed the build.
        run: |
          set -o pipefail
          node test/e2e-browser.js 2>&1 | tee e2e-output.log

      # Every link on the home page, search results, the reader (several modes), the TOC and
      # Settings, clicked for real against a server that resolves paths the way Capacitor does
      # (test/serve-local.js) — a link that is dead on the tablet fails here.
      - name: Click every link the way the device would
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/links.js 2>&1 | tee links-output.log

      # The Google sign-in handoff page (dg-node's siteroot/login/app-google.html), driven for real
      # with Firebase stubbed: after a popup sign-in it must return the ID token to the app, through
      # intent:// on Android and dhammagift:// on iOS. Both the iOS form and the fact that Android's
      # is unchanged are asserted — the page is shared with the shipped Android app, so a regression
      # here breaks sign-in on phones this repository no longer builds.
      - name: Check the Google sign-in handoff
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/login-handoff.test.js 2>&1 | tee login-handoff.log

      # The dhammagift:// handoff, on a real served bundle: /?_deepLink=<url> must land the SPA on a
      # page the contract promises, rendered from a database rather than merely changing the address.
      # This is the web half of the deep-link proof — Android's MainActivity builds exactly this URL,
      # and iOS calls the same mapping from its appUrlOpen handler. The other half runs in the iOS
      # simulator job (test/ios-sim/assert-deeplink.js).
      - name: Check the deep links land where they promise
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/deep-link-routes.js 2>&1 | tee deep-links-output.log

      # The same four links in WebKit. Routing is failed here as strictly as in Chromium; a missing
      # search-result marker is not — that needs OPFS, and WebKitGTK's storage is not WKWebView's
      # (iOS proves its own in the simulator job). The point is to catch engine-only breakage in the
      # handoff on a runner that costs seconds, not minutes.
      - name: Check the deep links in WebKit
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          DG_BROWSER: webkit
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/deep-link-routes.js 2>&1 | tee deep-links-webkit.log

      # Job log downloads need admin rights on this repo, which this workflow's own token doesn't
      # have — an artifact is the one way to actually read what this step printed when it fails
      # without that. Only uploaded on failure: the log is redundant with the console output on a
      # normal green run, and would otherwise pile up 30 days of identical "24/24 identical"
      # files for nothing.
      - name: Upload e2e output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.run_number }}
          path: |
            e2e-output.log
            links-output.log
            deep-links-output.log
            deep-links-webkit.log
            login-handoff.log
          retention-days: 7

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant gradlew permissions
        run: chmod +x android/gradlew

      # assembleDebug is auto-signed with the Android debug keystore (no secrets needed) — quick
      # to install for throwaway testing, but its signature can never match assetlinks.json
      # (see AndroidManifest.xml's autoVerify comment), so deep links on it always fall back to
      # the disambiguation chooser at best.
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: List build outputs
        run: ls -lah android/app/build/outputs/apk/debug/ || echo "Debug APK directory not found"

      # Every run publishes the APK as a build artifact, so a workflow_dispatch build is
      # installable without tagging anything. The release below only happens for tag pushes:
      # action-gh-release needs a tag to attach to, and on a dispatch run there is none — that
      # is what failed run #3 after the APK itself had already built fine.
      # The repository is public, so every artifact can be downloaded by anyone signed in to GitHub:
      # the APK/AAB/IPA files are kept 14 days (long enough to test a build and send it on with
      # play-upload.yml / ios-upload.yml), not 30.
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Release-signed build: the ONLY kind that can pass Android App Links verification (see
      # AndroidManifest.xml's autoVerify comment) — install this one, not the debug APK above, to
      # actually test deep links opening without the chooser dialog. Secrets are repo-level
      # (Settings -> Secrets and variables -> Actions), populated once from android.keystore's own
      # local android.keystore.readme (gitignored, never committed) and unrelated to Gradle's
      # own debug-keystore auto-signing above, which needs none of this.
      # Secret names: this repo's ANDROID_* or dg-twa's KEYSTORE_* — whichever set exists.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — skipping the release build this run."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        if: env.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        # The signing certificate's SHA-256 is public: it is what assetlinks.json must list for gift.dhamma.mobile.
        id: sig
        run: |
          ./gradlew assembleRelease -PdgVersionCode=${{ needs.plan.outputs.dg_number }} --stacktrace
          digest=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256' | sed -E 's/.*: *//')
          echo "$digest"
          echo "cert=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-apk-release-${{ needs.plan.outputs.dg_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # The AAB is what Google Play takes — an APK built from this same project cannot be uploaded
      # there, and until now the workflow produced only APKs (owner: "поправишь где надо git action
      # на сборку апок и aab"). Same keystore, same buildType: `bundleRelease` runs the identical
      # release variant and only changes the output packaging, so the AAB and the APK are the same
      # code signed by the same key.
      - name: Build Android Release AAB (Google Play)
        if: env.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        # Google Play's package for this listing is gift.dhamma.twa (the app replaces the TWA). Static shortcuts
        # name their package literally in res/xml, so that file follows the id; the test APK above keeps
        # gift.dhamma.mobile. ponytail: an in-place sed after the APK step, a Gradle-generated resource if it grows.
        run: |
          sed -i 's/android:targetPackage="gift.dhamma.mobile"/android:targetPackage="gift.dhamma.twa"/' app/src/main/res/xml/shortcuts.xml
          grep -c 'android:targetPackage="gift.dhamma.twa"' app/src/main/res/xml/shortcuts.xml
          ./gradlew bundleRelease -PdgAppId=gift.dhamma.twa -PdgVersionCode=${{ needs.plan.outputs.dg_number }} --stacktrace

      - name: Upload release AAB artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-aab-release-${{ needs.plan.outputs.dg_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # The emulator tests used to install the sideload APK (gift.dhamma.mobile) while Play got this AAB
      # (gift.dhamma.twa, its own shortcuts.xml): the package that reaches readers was never installed
      # anywhere before it did. bundletool makes the universal APK Play itself would serve from this very
      # AAB, signed with the same key, and android-tests runs its launcher-shortcut suite on that.
      - name: The Play bundle as an installable APK (for the emulator tests)
        if: env.skip != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/play.apks" \
            --aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --ks="$ANDROID_KEYSTORE_PATH" --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass="pass:$ANDROID_KEY_PASSWORD"
          mkdir -p play-apk
          unzip -o -q "$RUNNER_TEMP/play.apks" universal.apk -d play-apk
          pkg=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename play-apk/universal.apk)
          echo "package: $pkg"
          [ "$pkg" = gift.dhamma.twa ] || { echo "::error::the universal APK of the Play bundle is $pkg, not gift.dhamma.twa"; exit 1; }

      - name: Upload the Play bundle's APK
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-apk-play-${{ github.run_number }}
          path: play-apk/universal.apk
          if-no-files-found: error
          retention-days: 14

      # 214 MB per run, and phones download the site's own copy, not this one: kept two days, for a
      # look at what this run tested against (and for the GitHub release of a tag, which takes it
      # from here within the same run).
      - name: Upload offline database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-db-${{ github.run_number }}
          path: |
            /var/www/html/nodejs/siteroot/mobile-data/dg.db.gz
            /var/www/html/nodejs/siteroot/mobile-data/db-manifest.json
          if-no-files-found: error
          retention-days: 2

  # ---------------------------------------------------------------------------------------------
  # The GitHub release of a Dhamma.Gift tag: the sideload APK, the Play AAB and the database this
  # build expects, from the build job's artifacts. Its own small job because it is the only thing in
  # this workflow that writes to the repository — the build job, which runs third-party npm code for
  # an hour, keeps a read-only token.
  #
  # Named, clearly-labelled copies for the two very different things the build produces — a
  # sideloadable APK (gift.dhamma.mobile, for testing) and the Google Play bundle (gift.dhamma.twa,
  # replaces the TWA listing) — so the release page doesn't just show two files both called
  # "app-release.*" with no way to tell which is which. The debug APK is a CI smoke-test build; it was
  # attached to old releases by mistake and confused "which one do I install" — still in the per-run
  # artifacts if ever needed.
  github-release:
    name: GitHub release (Dhamma.Gift tag)
    needs: [plan, unit, build]
    if: needs.plan.outputs.github_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dg-app-full-apk-release-${{ needs.plan.outputs.dg_number }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: dg-app-full-aab-release-${{ needs.plan.outputs.dg_number }}
          path: aab
      - uses: actions/download-artifact@v4
        with:
          name: dg-app-full-db-${{ github.run_number }}
          path: db

      - name: Rename release assets
        env:
          VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp apk/app-release.apk "release-assets/dhamma-gift-$VERSION-sideload.apk"
          cp aab/app-release.aab "release-assets/dhamma-gift-$VERSION-play.aab"
          cp db/dg.db.gz db/db-manifest.json release-assets/
          ls -la release-assets

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          body: |
            App version ${{ needs.build.outputs.app_version }} (code ${{ needs.plan.outputs.dg_number }}), built from:
            - dg-apps `${{ github.sha }}`
            - dg-node `${{ needs.plan.outputs.dg_node_sha }}`

            - `*-sideload.apk` — package `gift.dhamma.mobile`, install directly on a device for testing. Points at https://dhamma.gift.
            - `*-play.aab` — package `gift.dhamma.twa`, upload to Google Play (updates the existing TWA listing).
            - `dg.db.gz` / `db-manifest.json` — the offline library this build expects.

            Signing certificate SHA-256: `${{ needs.build.outputs.cert }}`
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------------------------
  # The Android half of the release path: the AAB the `build` job already signed, straight to Play,
  # so a release stops depending on someone remembering to drag a file into a browser.
  #
  # Same shape as ios-release below, and dormant for the same reason: no secret, no upload, and a
  # job summary that says so, instead of a green tick that reads like a release happened.
  #
  # A testing track, never production: all three apps go to CLOSED testing (alpha). Dhamma.Gift used to go to open testing (beta);
  # the owner stopped that on 2026-10-08 (builds reached open testers with races and regressions nobody had caught): from now on
  # nothing is shipped to open testing from here, the owner tests with his own closed group. The dictionary and Uposatha moved up from
  # internal on 2026-10-04. Production
  # still costs a deliberate promote in the console, so an automated upload can never be the thing that
  # ships to readers by accident; that promote stays a human decision.
  #
  # What this needs once, in the Play Console (docs/ANDROID_RELEASE.md):
  #   Setup -> API access -> link a Google Cloud project -> create a service account -> JSON key;
  #   Users and permissions -> invite that service account's email -> give it "Release apps to
  #   testing tracks" on gift.dhamma.twa;
  #   GitHub -> Settings -> Secrets -> PLAY_SERVICE_ACCOUNT_JSON = the whole JSON file.
  # Play's "the first upload must be done by hand" rule is already satisfied: the package exists,
  # it replaced the TWA listing.
  # The upload itself is play-release.yml, the same few steps for all three apps; each app's job waits
  # for that app's checks, so a red check keeps its build out of the store.
  # Emulator tests on the same APK the owner gets (dg-apps#45): launcher shortcuts, recent searches in them,
  # Favorites & History, a recent text reopening. Runs on every build, in parallel with everything else;
  # the Play upload below waits for it, so a red test keeps a build out of the store.
  android-tests:
    name: Android emulator tests (shortcuts, history)
    needs: [plan, build]
    runs-on: ubuntu-latest
    # An iOS-only release has nothing to do with the Android half. Without this gate the emulator
    # suite ran on every dg-ios build, and a flaky launcher check failed the whole run AFTER the
    # IPA had already been uploaded to TestFlight (owner, 2026-10-01).
    if: needs.plan.outputs.dg_android_tests == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The package Play gets (gift.dhamma.twa, the universal APK of the very AAB that is uploaded),
      # not the sideload one: launcher shortcuts name their package, and only this one ships.
      - uses: actions/download-artifact@v4
        with:
          name: dg-app-full-apk-play-${{ github.run_number }}
          path: apk
      - name: OCR
        run: sudo apt-get install -y -qq tesseract-ocr ${{ inputs.video && 'ffmpeg' || '' }} > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The notification player (Pause / Play on the shade) on the debug APK, with both kinds of voice: the page's own audio and the
      # OS speech (tools/emu-tray.js). Added 2026-10-08 after "Play in the notification does nothing" (an audio-focus race between the
      # plugin and the WebView) reached testers: a red test keeps the build out of the store.
      - name: Debug APK for the notification player test
        uses: actions/download-artifact@v4
        with:
          name: dg-app-full-apk-${{ github.run_number }}
          path: apk-debug
      - name: Node for the notification player test
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      # One emulator for both scenarios (it used to boot twice, ~3 minutes each): the launcher shortcuts on the Play package,
      # then the notification player on the debug one. The runner runs the lines in order and stops at the first that fails,
      # as the second boot used to be skipped after a failed first one.
      - name: Emulator (shortcuts, then the notification player)
        env:
          VIDEO: ${{ inputs.video && '1' || '0' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash tools/emu-screens.sh "$(ls apk/*.apk | head -1)" shots gift.dhamma.twa shortcuts
            adb shell am force-stop gift.dhamma.twa
            TRAY_ENGINE=audio bash tools/emu-screens.sh "$(ls apk-debug/*.apk | head -1)" shots-tray-audio gift.dhamma.mobile tray
            TRAY_ENGINE=native bash tools/emu-screens.sh "$(ls apk-debug/*.apk | head -1)" shots-tray-native gift.dhamma.mobile tray
      - name: Verdict, notification player
        if: always()
        run: |
          for e in audio native; do { echo "### Notification player, $e voices"; echo '```'; cat shots-tray-$e/tray-result.txt 2>/dev/null | grep -E "^(PASS|FAIL)" || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tray-${{ github.run_number }}
          path: |
            shots-tray-audio
            shots-tray-native
          retention-days: 14

      - name: Verdict
        if: always()
        run: |
          { echo "### Android emulator tests"; echo '```'; cat shots/shortcuts-result.txt 2>/dev/null || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tests-${{ github.run_number }}
          path: shots
          retention-days: 14

  android-release:
    name: Android release (Play closed testing, alpha)
    needs: [plan, unit, build, android-tests]
    if: needs.plan.outputs.dg_play == 'true'
    uses: ./.github/workflows/play-release.yml
    with:
      app: Dhamma.Gift
      version_code: ${{ needs.plan.outputs.dg_number }}
      package: gift.dhamma.twa
      aab_artifact: dg-app-full-aab-release-${{ needs.plan.outputs.dg_number }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # ---------------------------------------------------------------------------------------------
  # The dictionary app (gift.dhamma.pali) — a Capacitor shell around https://dict.dhamma.gift,
  # living in dict/ of this repository (dict/README.md). It replaces the Bubblewrap TWA in
  # dg-twa/dict-app, which shipped under this same package id and is now superseded.
  #
  # A job of its own rather than more steps in `build`. That job exists to produce the offline
  # library — a dg-node checkout, a ~213MB database built on the runner, the TOC snapshot — and the
  # dictionary app needs none of it: its page is ddg-ui's static files, laid out from a shallow ddg-ui
  # checkout (plus find on the page from dg-node), with no database to build. Here it is `npm ci`, two
  # shallow checkouts and the Gradle tasks, minutes instead of the better part of an hour.
  #
  # versionCode is the dictionary's own build number (plan job, .github/scripts/build_numbers.py): above
  # the highest code Play has for gift.dhamma.pali and the highest TestFlight build, independent of the
  # other two apps. build.gradle carries 3 (the first code after the TWA's 2) for a local build.
  #
  # The APKs and the AAB stay workflow artifacts. They are deliberately NOT attached to the reader
  # app's GitHub release: that release already has two Android files that are easy to confuse, and
  # a third one from a different application is worse. What ships to readers goes through the Play
  # job below, which is the only path that needs the artifact anyway.
  dict-build:
    name: Dictionary app (Android)
    needs: plan
    runs-on: ubuntu-latest
    # Only when the dictionary is what was asked for (dict_only, dict / dict-ios, a dict-v* tag). Every
    # manual run used to build all three apps, whatever the release target was (owner, 2026-10-01).
    if: needs.plan.outputs.build_dict == 'true'
    timeout-minutes: 40
    # Artifacts only — nothing here creates or edits a GitHub release.
    permissions:
      contents: read
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'  # Capacitor 8 (AGP 8.13) needs JDK 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install the dictionary app's dependencies
        working-directory: dict
        run: npm ci

      # The app bundles the dictionary's page (both languages): it opens with no network, and updates itself from
      # the site when there is one. The page is laid out from a ddg-ui checkout pinned by DICT_UI_REF (the site is
      # its public/, static files), and Dhamma.Gift's find-on-page from the dg-node checkout pinned by DG_NODE_REF
      # (dict/tools/bundle-from-repo.js) — no live site, no browser: it used to be crawled off dict.dhamma.gift, so a
      # build shipped whatever production served that minute. Fails the job when a file a page references is missing.
      - name: Checkout ddg-ui (the dictionary's page) and dg-node (find on the page)
        env:
          DDG_UI_SHA: ${{ needs.plan.outputs.ddg_ui_sha }}
          DG_NODE_SHA: ${{ needs.plan.outputs.dg_node_sha }}
        run: |
          for pair in "ddg-ui $DDG_UI_SHA" "dg-node $DG_NODE_SHA"; do
            set -- $pair
            mkdir -p "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" init -q
            git -C "$RUNNER_TEMP/$1" remote add origin "https://github.com/dhammagift/$1.git"
            git -C "$RUNNER_TEMP/$1" fetch --depth 1 origin "$2" -q
            git -C "$RUNNER_TEMP/$1" checkout -q FETCH_HEAD
            echo "$1@$2 = $(git -C "$RUNNER_TEMP/$1" rev-parse HEAD)"
          done

      - name: Lay the dictionary's page out from ddg-ui
        working-directory: dict
        run: node tools/bundle-from-repo.js "$RUNNER_TEMP/ddg-ui" "$RUNNER_TEMP/dg-node"

      # Every file the two pages and their stylesheets reference is in the bundle, and a missing one fails the build.
      - name: Bundle checks (references, size)
        run: node dict/test/bundle-files.js "$RUNNER_TEMP/ddg-ui" "$RUNNER_TEMP/dg-node"

      # src/ -> www/ -> android/app/src/main/assets/public: the bundled page, dict-bridge.js and the
      # offline page where MainActivity and Capacitor read them from. Not optional: the asset sync is what
      # puts dict-bridge.js where MainActivity reads it from. It also RUNS build.js (npm run build), which is
      # what produces dict/www/ in the first place — the upload below must come after this, not before.
      - name: Sync Capacitor
        working-directory: dict
        run: npm run sync-android

      # The web bundle the APK is built from (dict/www: the page, the bridge, the sounds), for the iOS job below:
      # the same files go into both apps, so the page is snapshotted once.
      - name: Upload the dictionary web bundle
        uses: actions/upload-artifact@v4
        with:
          name: dict-www-${{ github.run_number }}
          path: dict/www
          if-no-files-found: error
          retention-days: 14

      # The bundled page in a real browser, before anything is packaged: it opens with every request to
      # the network refused, the updater hands over exactly the file the site changed, and the app's own
      # burger rows (src/dict-bridge.js) land in the page in both languages and themes. bridge-ui.js is
      # pointed at the bundle itself (test/serve-www.js over www/: a directory's index.html and /ru/static/
      # from /static/, like the app's DgSitePlugin), not at the live dictionary; the bridge goes in at
      # document start, as MainActivity injects it. The tests load Playwright from the path it has on the dev server, so
      # that path is pointed at this app's own copy. Every dictionary upload waits for this job.
      # The browsers are the same bytes for one Playwright version, so they are kept between runs, keyed by that version (the
      # system libraries --with-deps adds still come from apt each time).
      - name: Playwright version (the browsers' cache key)
        id: pw
        working-directory: dict
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ steps.pw.outputs.version }}-chromium

      - name: Browser checks of the bundled page (offline start, updater, the app's rows)
        working-directory: dict
        env:
          DG_SHOTS: ${{ runner.temp }}/dict-shots
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo mkdir -p /usr/lib/node_modules/@playwright/cli/node_modules
          sudo ln -sfn "$PWD/node_modules/playwright" /usr/lib/node_modules/@playwright/cli/node_modules/playwright
          mkdir -p "$DG_SHOTS"
          node test/bundle-ui.js
          node test/serve-www.js www 8191 > /dev/null 2>&1 &
          sleep 1
          DG_DICT_URL=http://127.0.0.1:8191/ node test/bridge-ui.js

      - name: Grant gradlew permissions
        run: chmod +x dict/android/gradlew

      - name: Build Debug APK
        working-directory: dict/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-dict-apk-${{ github.run_number }}
          path: dict/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Same keystore and the same secret names as Dhamma.Gift (this repo's ANDROID_* or
      # dg-twa's KEYSTORE_* — whichever set exists), so one key signs both apps. When no secret is
      # present the release build is skipped rather than failing: a fork must still be able to run
      # this workflow.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — skipping the signed dictionary build this run."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        if: env.skip != 'true'
        working-directory: dict/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PdgVersionCode=${{ needs.plan.outputs.dict_number }} --stacktrace

      - name: Upload release APK artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-dict-apk-release-${{ needs.plan.outputs.dict_number }}
          path: dict/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release AAB (Google Play)
        if: env.skip != 'true'
        working-directory: dict/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        # gift.dhamma.pali, not Dhamma.Gift's gift.dhamma.twa: this AAB updates the dictionary's
        # own listing, which is the one the TWA created.
        run: ./gradlew bundleRelease -PdgVersionCode=${{ needs.plan.outputs.dict_number }} --stacktrace

      - name: Upload release AAB artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-dict-aab-release-${{ needs.plan.outputs.dict_number }}
          path: dict/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  # The signed release APKs of the dictionary and Uposatha on an emulator, before their Play uploads:
  # installed, opened from the launcher, the page painted, the process alive, no crash in the log
  # (tools/emu-launch.sh). Also on the test runs of that app (dict_only / uposatha), so the check is
  # known to work before a release depends on it.
  dict-launch:
    name: Dictionary app launch check (emulator)
    needs: [plan, dict-build]
    if: needs.plan.outputs.dict_launch == 'true'
    uses: ./.github/workflows/launch-check.yml
    with:
      apk_artifact: dg-dict-apk-release-${{ needs.plan.outputs.dict_number }}
      package: gift.dhamma.pali

  # The dictionary driven the way a reader uses it (dict/test/emu-tour.js): search (Velthuis, autocomplete, English,
  # Russian), favourites and history, EN/RU, theme, the app's own menu rows and the update check, launcher shortcuts and
  # the long-press menu, find on the page, the Pāli letters bar, share and text selection, the Quick Settings tile,
  # the offline mini-dictionary with the network off, the no-connection page, a turn, the Back button. Real touches on
  # an emulator, the page read over DevTools (so the DEBUG APK), one video per case in the artifact. Test runs only.
  dict-tour:
    name: Dictionary app feature tour (emulator)
    needs: [plan, dict-build]
    if: needs.plan.outputs.build_dict == 'true' && needs.plan.outputs.dict_play != 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@v4
        with:
          name: dg-dict-apk-${{ github.run_number }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Feature tour on API 34
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node dict/test/emu-tour.js "$(ls apk/*.apk | head -1)" tour
      - name: Verdict
        if: always()
        run: |
          { echo "### Dictionary feature tour"; echo '```'; cat tour/results.txt 2>/dev/null || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dict-tour-${{ github.run_number }}
          path: tour
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # The Uposatha calendar app (gift.dhamma.uposatha) — a Capacitor shell around the site's calendar
  # page, living in uposatha/ of this repository. The same shape as dict-build above: no database,
  # `npm ci` plus Gradle. The page is bundled from the pinned dg-node checkout (it opens offline) with
  # the layer around it — the reminders' plugins, the sounds in res/raw, the launcher shortcuts, the
  # launch screens.
  #
  # Artifacts only: the store uploads are uposatha-release (Play, closed testing) and uposatha-ios-release
  # (TestFlight) below, on release = uposatha / uposatha-ios or an upo-v* tag.
  uposatha-build:
    name: Uposatha app (Android)
    needs: plan
    runs-on: ubuntu-latest
    # Same gate as dict-build, its own target only (owner, 2026-10-01: uposatha / uposatha-ios, an upo-v*
    # tag), plus ios_checks and uposatha: the iOS simulator job below needs this job's web bundle, and a
    # manual ios_checks run asks for nothing else (release=none uploads nothing anywhere).
    if: needs.plan.outputs.build_upo == 'true'
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'  # Capacitor 8 (AGP 8.13) needs JDK 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install the Uposatha app's dependencies
        working-directory: uposatha
        run: npm ci

      # The app bundles the calendar page: it opens with no network. The page is taken from the dg-node
      # checkout the build is pinned to (DG_NODE_REF, or the dg_node_ref input), not from a running site: a
      # build no longer depends on what production serves at that minute, and a change to the calendar
      # reaches an app by being in dg-node, not by being deployed. Only the texts (json) follow the site at
      # run time (updatable in uposatha-bridge.js). Fails the job when a file of the page is not in dg-node.
      - name: Checkout dg-node (the calendar page and what it loads)
        env:
          DG_NODE_SHA: ${{ needs.plan.outputs.dg_node_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/dg-node"
          cd "$RUNNER_TEMP/dg-node"
          git init -q
          git remote add origin https://github.com/dhammagift/dg-node.git
          git fetch --depth 1 origin "$DG_NODE_SHA" -q
          git checkout -q FETCH_HEAD
          echo "dg-node = $(git rev-parse HEAD)"

      # The page's icon bundle is generated in dg-node (gitignored there), from the same source and script as the site's and
      # Dhamma.Gift's: one shared set, not a copy kept here. --ignore-scripts: only the icon package is needed, no native builds.
      - name: Build dg-node's icon bundle (fontawesome-local.js)
        working-directory: ${{ runner.temp }}/dg-node
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps --ignore-scripts --no-audit --no-fund   # dg-node has no lock file: npm ci refuses
          npm run build-icons

      - name: Lay the calendar page out from dg-node
        working-directory: uposatha
        run: node tools/bundle-from-repo.js "$RUNNER_TEMP/dg-node"

      # The list of files is dg-node's own (scripts/uposatha-files.js reads the page, its css and its scripts); this checks,
      # from the bundle itself, that every file the page and its stylesheets reference is there, and that it stays small.
      - name: Bundle checks (references, size)
        run: node uposatha/test/bundle-files.js "$RUNNER_TEMP/dg-node"

      # The edge-to-edge check below drives the bundled page in a real browser; the snapshot step that
      # used to install it is gone.
      # The browsers are the same bytes for one Playwright version, so they are kept between runs, keyed by that version (the
      # system libraries --with-deps adds still come from apt each time).
      - name: Playwright version (the browsers' cache key)
        id: pw
        working-directory: uposatha
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ steps.pw.outputs.version }}-chromium

      - name: Install the browser for the page checks
        working-directory: uposatha
        run: npx playwright install --with-deps chromium

      # src/ -> www/ -> android/app/src/main/assets/public: the bundled page, uposatha-bridge.js and
      # the offline page where MainActivity and Capacitor read them from.
      - name: Sync Capacitor
        working-directory: uposatha
        run: npm run sync-android

      # Edge to edge (dg-apps#41): the bundled page must carry viewport-fit=cover, the DgBars plugin
      # must be gone, the bar icons must follow the page's theme and the top bar must step down by
      # the inset only where the platform really pays it. Runs on the just-built www/ (the same files
      # the APK packages) and needs no network. The real proof is the emulator check
      # (android-screens.yml, mode=edgetoedge): the pixels of a screenshot on Android.
      - name: Edge-to-edge checks (bundle, bridge, resources)
        run: node uposatha/test/edge-to-edge.js

      # The bundled page in a real browser, on the just-built www/: it opens with the network refused and
      # the updater hands over only what the site changed (bundle-ui.js), the person's own sound is in all
      # four lists (own-sound.js), and the bridge's shortcuts, reminders and launch screens over the bundled
      # calendar page (bridge-ui.js, served the way Capacitor serves it, not from a running dg-node). The
      # tests load Playwright from the path it has on the dev server, so that path is pointed at this app's
      # own copy. Every Uposatha upload waits for this job.
      - name: Browser checks of the bundled page (offline start, own sound, the bridge)
        env:
          DG_SHOTS: ${{ runner.temp }}/upo-shots
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/lib/node_modules/@playwright/cli/node_modules
          sudo ln -sfn "$GITHUB_WORKSPACE/uposatha/node_modules/playwright" /usr/lib/node_modules/@playwright/cli/node_modules/playwright
          mkdir -p "$DG_SHOTS"
          node uposatha/test/bundle-ui.js
          node uposatha/test/own-sound.js
          node test/serve-local.js uposatha/www "$RUNNER_TEMP/no-dist" 8192 > /dev/null 2>&1 &
          sleep 1
          DG_SITE=http://127.0.0.1:8192 node uposatha/test/bridge-ui.js

      - name: Grant gradlew permissions
        run: chmod +x uposatha/android/gradlew

      - name: Build Debug APK
        working-directory: uposatha/android
        run: ./gradlew assembleDebug -PdgVersionCode=${{ needs.plan.outputs.uposatha_number }} --stacktrace

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-uposatha-apk-${{ github.run_number }}
          path: uposatha/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The web bundle the APK was built from (uposatha/www: the page, the bridge, the sounds), for the iOS job below:
      # the same files go into both apps, so the page is snapshotted once.
      - name: Upload the Uposatha web bundle
        uses: actions/upload-artifact@v4
        with:
          name: uposatha-www-${{ github.run_number }}
          path: uposatha/www
          if-no-files-found: error
          retention-days: 14

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — skipping the signed Uposatha build this run."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        if: env.skip != 'true'
        working-directory: uposatha/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PdgVersionCode=${{ needs.plan.outputs.uposatha_number }} --stacktrace

      - name: Upload release APK artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-uposatha-apk-release-${{ needs.plan.outputs.uposatha_number }}
          path: uposatha/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release AAB (Google Play)
        if: env.skip != 'true'
        working-directory: uposatha/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PdgVersionCode=${{ needs.plan.outputs.uposatha_number }} --stacktrace

      - name: Upload release AAB artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-uposatha-aab-release-${{ needs.plan.outputs.uposatha_number }}
          path: uposatha/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  uposatha-launch:
    name: Uposatha app launch check (emulator)
    needs: [plan, uposatha-build]
    if: needs.plan.outputs.upo_launch == 'true'
    uses: ./.github/workflows/launch-check.yml
    with:
      apk_artifact: dg-uposatha-apk-release-${{ needs.plan.outputs.uposatha_number }}
      package: gift.dhamma.uposatha

  # The Uposatha app's Play release: the signed AAB uposatha-build made, uploaded to the closed testing (alpha) track of
  # gift.dhamma.uposatha. On release = uposatha, or an upo-v* tag (which also sends it to TestFlight); never with another app.
  # Waits for the bundle's browser checks (uposatha-build) and the launch check on an emulator.
  uposatha-release:
    name: Uposatha app release (Play closed testing, alpha)
    needs: [plan, unit, uposatha-build, uposatha-launch]
    if: needs.plan.outputs.upo_play == 'true'
    uses: ./.github/workflows/play-release.yml
    with:
      app: Uposatha
      version_code: ${{ needs.plan.outputs.uposatha_number }}
      package: gift.dhamma.uposatha
      aab_artifact: dg-uposatha-aab-release-${{ needs.plan.outputs.uposatha_number }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # Uposatha on iOS (uposatha/ios): builds the app for the simulator from the same web bundle as the APK, launches it and
  # keeps a screenshot. Started with `ios_checks` or `uposatha` (no Apple account, certificate or device needed), and always
  # before Uposatha goes to TestFlight (uposatha-ios, an upo-v* tag): the upload waits for it.
  uposatha-ios:
    name: Uposatha app (iOS simulator)
    needs: [plan, uposatha-build]
    if: needs.plan.outputs.upo_ios_checks == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the web bundle
        uses: actions/download-artifact@v4
        with:
          name: uposatha-www-${{ github.run_number }}
          path: uposatha/www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Restore npm and SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            uposatha/ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-upo-ios-${{ hashFiles('uposatha/ios/App/CapApp-SPM/Package.swift', 'uposatha/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-upo-ios-

      - name: Install the app's dependencies
        working-directory: uposatha
        run: npm ci

      # A notification's sound on iOS is a file of the app in a format Apple names (Core Audio, at most 30 s), not an mp3: the
      # same sounds as the Android app's res/raw, converted here, and shipped inside the page bundle (www/ios-sounds/).
      - name: Make the reminders' sounds
        run: |
          mkdir -p uposatha/www/ios-sounds
          for f in uposatha/android/app/src/main/res/raw/*.mp3; do
            n=$(basename "$f" .mp3)
            afconvert -f caff -d ima4 -c 1 "$f" "uposatha/www/ios-sounds/$n.caf"
          done
          ls -la uposatha/www/ios-sounds

      - name: Select Xcode
        run: tools/select-xcode.sh

      - name: Sync Capacitor into uposatha/ios
        working-directory: uposatha
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        working-directory: uposatha/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../../ios-build.log | tail -30

      - name: Upload the xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uposatha-ios-build-log-${{ github.run_number }}
          path: uposatha/ios-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate the rotation test project
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd uposatha/test/ios-sim/rotatetest && xcodegen generate)

      # tools/ios-edgetoedge.sh measures each screenshot (tools/edge-pixels.py) — a blank page must
      # not pass as evidence. Without Pillow the runner reported every shot "blank" (run 446).
      - name: Python imaging for the screenshot checks
        # --break-system-packages: the macOS runner's Homebrew python is externally managed and
        # refuses a plain --user install (run 447 died on exactly that).
        run: python3 -m pip install --user --quiet --break-system-packages pillow

      # Edge to edge (dg-apps#41), the iOS proof: portrait and landscape, light and dark, one
      # screenshot per combination, plus the whole pass as a video on request. tools/ios-edgetoedge.sh
      # rotates through the XCUI test above (simctl cannot) and verifies each rotation from the
      # screenshot's own dimensions.
      - name: Run it in a simulator (portrait/landscape, light/dark)
        env:
          VIDEO: ${{ inputs.ios_video && '1' || '0' }}
        run: tools/ios-edgetoedge.sh uposatha/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app shots gift.dhamma.uposatha

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uposatha-ios-screenshots-${{ github.run_number }}
          path: shots
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the simulator .app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uposatha-ios-simulator-${{ github.run_number }}
          path: uposatha/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
          if-no-files-found: error

  # Uposatha's TestFlight release (release = uposatha-ios, or an upo-v* tag): testflight-release.yml, from the web bundle
  # uposatha-build made, after the bundle's browser checks and the iOS simulator run (uposatha-ios). It needs the app's
  # record in App Store Connect (bundle id gift.dhamma.uposatha); the signing secrets are the account's, the same as the reader's.
  uposatha-ios-release:
    name: Uposatha app iOS release (TestFlight)
    needs: [plan, unit, uposatha-build, uposatha-ios]
    if: needs.plan.outputs.upo_ios == 'true'
    uses: ./.github/workflows/testflight-release.yml
    with:
      app: uposatha
      build_number: ${{ needs.plan.outputs.uposatha_number }}
      upload: true
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # The dictionary's TestFlight release (release = dict-ios, or a dict-v* tag), after the bundle's browser checks in dict-build.
  # (The dictionary has no iOS simulator check of its own yet; its screenshot tour is the only iOS run it gets.)
  dict-ios-release:
    name: Dictionary app iOS release (TestFlight)
    needs: [plan, unit, dict-build]
    if: needs.plan.outputs.dict_ios == 'true'
    uses: ./.github/workflows/testflight-release.yml
    with:
      app: dict
      build_number: ${{ needs.plan.outputs.dict_number }}
      upload: true
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
