  # ---------------------------------------------------------------------------------------------
  # The dictionary half of the Play release path, the same shape as android-release above: release = dict
  # (or a dict-v* tag) uploads the dictionary, and only the dictionary, after its bundle checks (dict-build)
  # and its launch check on an emulator (dict-launch). `release: none` — the default — uploads nothing.
  #
  # Closed testing (alpha), for the same reason as Dhamma.Gift's testing track: promoting it to
  # production stays a human decision in the Play Console.
  #
  # The same PLAY_SERVICE_ACCOUNT_JSON as Dhamma.Gift, and the same service account: it already
  # holds "Release apps to testing tracks" on gift.dhamma.pali (dg-twa's workflow uploaded this
  # package with it). If that permission is ever revoked, the upload fails here with a 401/403 —
  # which is the point of asking Play rather than assuming.
  dict-release:
    name: Dictionary app release (Play closed testing, alpha)
    needs: [plan, unit, dict-build, dict-launch]
    if: needs.plan.outputs.dict_play == 'true'
    uses: ./.github/workflows/play-release.yml
    with:
      app: Dictionary
      version_code: ${{ needs.plan.outputs.dict_number }}
      package: gift.dhamma.pali
      aab_artifact: dg-dict-aab-release-${{ needs.plan.outputs.dict_number }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # ---------------------------------------------------------------------------------------------
  # iOS: build the Capacitor project for the simulator on a macOS runner.
  #
  # A simulator build is the entire point of this job: it needs no Apple Developer account, no
  # signing certificate and no device — exactly what is available right now. It is also the only
  # check that the Swift side (plugins, Info.plist, storyboard, asset catalog) compiles at all:
  # the Android job cannot see any of it, and a broken pbxproj or Info.plist stays invisible until
  # somebody opens Xcode on a Mac.
  #
  # Why this runner and not macos-latest: Capacitor 8 requires Xcode 26.0+, and macos-15's DEFAULT
  # Xcode is 16.4, which cannot build this project at all. macos-26 ships Xcode 26.x and the
  # simulator runtimes iOS 26.x. Xcode is picked by tools/select-xcode.sh: the newest non-beta Xcode 26
  # on the image (Apple refuses store builds from a beta), named in the job summary.
  #
  # The SPM template (Capacitor 8's default for `cap add ios`) means no CocoaPods and no Ruby step.
  #
  # Note the upload of the bundle in the `build` job above: this job re-uses the exact www/ the
  # Android APK and the browser checks were built from, instead of re-running dg-node's dg.db
  # pipeline, which iOS does not need (the app downloads dg.db itself at runtime).
  ios-build:
    name: iOS simulator build
    needs: [plan, build]
    # ios_checks, and always when an IPA is made (dg-ios, dg-both, keep_ipa, a Dhamma.Gift tag): ios-release waits for it.
    if: needs.plan.outputs.dg_ios_checks == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      # SwiftPM fetches capacitor-swift-pm and resolves every plugin package from GitHub on a cold
      # runner, and Xcode then compiles all of them into DerivedData — between them the slowest part
      # of these jobs. Cached, and cached BEFORE anything is installed or built:
      #   ~/.npm                                  the npm install below
      #   ~/Library/Caches/org.swift.swiftpm      the shared repository cache SwiftPM clones into
      #   ios/DerivedData/SourcePackages          the checkouts and build products these jobs use:
      #                                           both build with -derivedDataPath, so they are NOT
      #                                           under ~/Library/Developer/Xcode/DerivedData (the
      #                                           path generic CI advice names — a cache there would
      #                                           stay empty and save nothing)
      #   ~/Library/Developer/Xcode/DerivedData   kept for any build that runs without the flag
      # Keyed on what decides the dependency graph rather than on source: Package.swift (Capacitor's
      # exact version), the pbxproj (target and package wiring), Package.resolved if one is ever
      # committed, and package-lock.json (the npm packages the plugin packages are referenced from).
      # restore-keys means a run that bumps one of them still reuses the previous checkouts instead of
      # re-cloning everything.
      - name: Restore npm and SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj', 'ios/**/Package.resolved', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Select Xcode
        run: tools/select-xcode.sh

      # Apple's required-reason APIs have to be DECLARED in the app's own PrivacyInfo.xcprivacy:
      # FileManager's size/timestamp/metadata reads, UserDefaults, system boot time, disk space and
      # active keyboards. This app avoids them instead — DgDownloadPlugin lists file NAMES only — so
      # there is no manifest to keep in step with anything, and this check is what keeps that true.
      # The day one of them appears, the build names the category to declare (FileTimestamp reason
      # C617.1 for app-container files) instead of leaving App Store upload to discover it.
      - name: Check for Apple required-reason APIs in our own Swift
        run: |
          if grep -nE "attributesOfItem|contentModificationDateKey|creationDateKey|fileModificationDate|resourceValues\(forKeys|UserDefaults\.standard|systemUptime|mach_absolute_time|volumeAvailableCapacity|\bstatfs?\(" ios/App/App/*.swift; then
            echo "::error::a required-reason API is used in our own Swift — either declare it in a PrivacyInfo.xcprivacy or stop using it"
            exit 1
          fi
          echo "no required-reason APIs in our own Swift"

      - name: Sync Capacitor into ios/
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-build.log | tail -30

      # Job log downloads need admin rights on this repo, so an artifact is the only way to read a
      # failed xcodebuild's output (same reason the e2e job does this).
      - name: Upload the xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_number }}
          path: ios-build.log
          retention-days: 7
          if-no-files-found: ignore

      # The share extension is a second target: it builds into the app's PlugIns directory, and the
      # app is useless as a share target if it is missing or points at the wrong extension point.
      # Everything the extension DOES (read the payload, hand it over) is covered by the deep-link
      # checks: it delivers dhammagift://search?q=…, which is already a tested contract.
      - name: Check the share extension is inside the app
        run: |
          APP="ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          EX="$APP/PlugIns/ShareExtension.appex"
          test -d "$EX" || { echo "::error::the share extension is not embedded in the app"; exit 1; }
          xcrun plutil -p "$EX/Info.plist" | grep -q "com.apple.share-services" \
            || { echo "::error::the embedded extension is not a share extension"; xcrun plutil -p "$EX/Info.plist"; exit 1; }
          xcrun plutil -p "$EX/Info.plist" | grep -q "NSExtensionActivationSupportsText" \
            || { echo "::error::the extension no longer accepts text"; exit 1; }
          ls "$APP/PlugIns"
          echo "share extension embedded and configured"

      - name: Upload the simulator .app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-ios-simulator-${{ github.run_number }}
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # iOS: run the real app in a simulator and prove the offline data layer works THERE.
  #
  # This is the check that matters most and the one that needs the least: no Apple account, no
  # certificate, no device, no server. The bundle is prepared so the fixture database sits inside the
  # app itself (/mobile-data) and every internet fallback points at a dead port, so a 200 answer can
  # only have come from the SQLite database opened in WKWebView through OPFS. Then CI reads the
  # app's own JSON report out of its container and fails on a wrong answer.
  #
  # It also produces the light/dark x en/ru screenshots the owner reviews — the same requirement the
  # web work is held to, on the platform where the WebView is a different engine.
  ios-ui:
    name: iOS simulator checks
    needs: [plan, build]
    if: needs.plan.outputs.dg_ios_checks == 'true'   # the same rule as ios-build; ios-release waits for both
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      # SwiftPM fetches capacitor-swift-pm and resolves every plugin package from GitHub on a cold
      # runner, and Xcode then compiles all of them into DerivedData — between them the slowest part
      # of these jobs. Cached, and cached BEFORE anything is installed or built:
      #   ~/.npm                                  the npm install below
      #   ~/Library/Caches/org.swift.swiftpm      the shared repository cache SwiftPM clones into
      #   ios/DerivedData/SourcePackages          the checkouts and build products these jobs use:
      #                                           both build with -derivedDataPath, so they are NOT
      #                                           under ~/Library/Developer/Xcode/DerivedData (the
      #                                           path generic CI advice names — a cache there would
      #                                           stay empty and save nothing)
      #   ~/Library/Developer/Xcode/DerivedData   kept for any build that runs without the flag
      # Keyed on what decides the dependency graph rather than on source: Package.swift (Capacitor's
      # exact version), the pbxproj (target and package wiring), Package.resolved if one is ever
      # committed, and package-lock.json (the npm packages the plugin packages are referenced from).
      # restore-keys means a run that bumps one of them still reuses the previous checkouts instead of
      # re-cloning everything.
      - name: Restore npm and SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj', 'ios/**/Package.resolved', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Select Xcode
        run: |
          tools/select-xcode.sh
          xcrun simctl list devices available | head -20

      # The fixture is built from source (test/make-fixture-db.js needs no corpus and no dg.db):
      # a small database in the real schema, with the texts the self-test asks about.
      - name: Build the fixture database
        run: node test/make-fixture-db.js test/fixture.db

      # --library-dir: the fixture is NOT bundled this time. It is written beside the build and
      # copied into the app's own storage by drive.sh, so the app has to find it through
      # DgDownloadPlugin and import it from there — the native path, exercised with no network at
      # all (every origin in the bundle points at a dead port).
      - name: Turn www/ into a simulator test bundle
        run: node test/ios-sim/prepare-www.js --library-dir .tmp/ios-library

      - name: Sync Capacitor into ios/
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-ui-build.log | tail -30

      - name: Run the app in the simulator and pull its report out
        run: test/ios-sim/drive.sh --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app --out .tmp/ios-ui --library .tmp/ios-library

      - name: Judge the report
        run: node test/ios-sim/assert.js .tmp/ios-ui/selftest.json

      # The share sheet, from the outside (test/ios-sim/sharetest): Safari is sent to a page, and
      # an XCUITest bundle — its own small xcodegen project, no host app — taps Safari's share
      # button, picks Dhamma.gift in the system sheet and checks that our sheet opens and stays.
      # Runs on the same booted simulator, with the app drive.sh installed.
      - name: Share sheet check (XCUITest)
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          UDID=$(xcrun simctl list devices booted | grep -o '[0-9A-F-]\{36\}' | head -1)
          test -n "$UDID" || { echo "::error::no booted simulator after drive.sh"; exit 1; }
          xcrun simctl openurl "$UDID" "https://example.com/"
          sleep 5
          (cd test/ios-sim/sharetest && xcodegen generate)
          xcodebuild test \
            -project test/ios-sim/sharetest/ShareSheetTests.xcodeproj \
            -scheme ShareSheetTests \
            -destination "id=$UDID" \
            -derivedDataPath ios/DerivedData \
            -resultBundlePath .tmp/ios-ui/sharesheet.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee .tmp/ios-ui/sharesheet-test.log | grep -E "Test Case|error:|failed|passed|\*\* TEST" || true
          xcrun simctl io "$UDID" screenshot .tmp/ios-ui/ios-share-sheet.png >/dev/null || true
          grep -q "\*\* TEST SUCCEEDED \*\*" .tmp/ios-ui/sharesheet-test.log || { echo "::error::the share sheet check failed — see sharesheet-test.log and sharesheet.xcresult"; exit 1; }

      - name: Upload the report, the screenshots and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-ios-ui-${{ github.run_number }}
          path: |
            .tmp/ios-ui/selftest.json
            .tmp/ios-ui/*.png
            .tmp/ios-ui/app-console.log
            .tmp/ios-ui/sharesheet-test.log
            .tmp/ios-ui/sharesheet.xcresult
            ios-ui-build.log
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # Screenshots of the app doing things — the owner's question was "why only the table of contents",
  # and the answer is that a store listing needs to show search results, a text in the reader, the
  # dictionary popup, settings, history.
  #
  # Which is why this job runs against the LIVE site instead of the fixture: three suttas and no
  # dictionary data make honest but useless pictures. The bundle declines the offline library so the
  # run does not spend its time downloading 216 MB, and every screenshot is taken on an iPhone 17
  # Pro Max because the App Store wants a 6.9" display.
  #
  # The page drives itself (test/ios-sim/tour.js): from outside the WebView nothing can press a
  # button, so the tour renders each view through the SPA's own router, taps a Pali word for the
  # dictionary, opens the settings sheet the way the app does, and writes the stage name to a file
  # the driver waits on — a screenshot at a guessed moment looks like a bug, not a gap.
  ios-screenshots:
    name: iOS screenshots (6.9", online)
    needs: build
    if: inputs.screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Restore npm and SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj', 'ios/**/Package.resolved', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Select Xcode
        run: tools/select-xcode.sh

      # --online --tour: the real site, no fixture, no dead origin, download declined, and the tour
      # script instead of the self-test (see test/ios-sim/prepare-www.js).
      - name: Turn www/ into the screenshot-tour bundle
        run: node test/ios-sim/prepare-www.js --online --tour

      - name: Sync Capacitor into ios/
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-tour-build.log | tail -30

      # App Store Connect's iPhone slot for this app lists 1242x2688 and 1284x2778 — the 6.9" frame
      # (1320x2868) is not among them, so the submission set is taken on a 6.7" device. The runner
      # image ships only current iPhone types, so the device is CREATED from an older device type on
      # the newest iOS runtime: a device type is a hardware profile, and iOS 26 still runs iPhone 13
      # Pro Max (1284x2778, exactly the size the page accepts).
      - name: Prepare a 6.7" device (the size the store page accepts)
        id: sixseven
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | sort -V | tail -1)
          TYPE=$(xcrun simctl list devicetypes | grep -Eo 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-1[1-3]-Pro-Max' | sort -V | tail -1)
          echo "runtime=$RUNTIME type=$TYPE"
          if [ -n "$RUNTIME" ] && [ -n "$TYPE" ]; then
            xcrun simctl create "DG-6.7" "$TYPE" "$RUNTIME" >/dev/null
            echo "device=DG-6.7" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not create a 6.7\" device — falling back to the iPhone 17 Pro Max (6.9\", which the store page may refuse)"
            echo "device=iPhone 17 Pro Max" >> "$GITHUB_OUTPUT"
          fi

      - name: Walk the app and take pictures (6.7", the submission size)
        run: |
          mkdir -p .tmp/ios-tour
          # The online tour needs the runner's network; a failure here must not be silent.
          curl -sf -o /dev/null --max-time 20 https://dhamma.gift/ || echo "::warning::dhamma.gift did not answer — the tour will show the app's offline states"
          test/ios-sim/drive.sh --tour --out .tmp/ios-tour --device "${{ steps.sixseven.outputs.device }}" \
            --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      # Kept as well: a 6.9" set costs two minutes and covers the case where the store page shows the
      # newer slot instead (Apple has been moving new apps to 6.9").
      - name: The same tour on a 6.9" iPhone (in case the store asks for that size)
        run: |
          mkdir -p .tmp/ios-tour-69
          test/ios-sim/drive.sh --tour --out .tmp/ios-tour-69 --device "iPhone 17 Pro Max" \
            --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      # The app declares TARGETED_DEVICE_FAMILY = "1,2", so App Store Connect wants a 13" iPad set as
      # well — and a submission without it is refused at the upload, not at the review. The same tour,
      # one more device.
      - name: The same tour on a 13" iPad (the other required screenshot size)
        run: |
          mkdir -p .tmp/ios-tour-ipad
          test/ios-sim/drive.sh --tour --out .tmp/ios-tour-ipad --device "iPad Pro 13-inch (M5)" \
            --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-ios-screenshots-${{ github.run_number }}
          path: |
            .tmp/ios-tour/*.png
            .tmp/ios-tour/app-console.log
            .tmp/ios-tour-69/*.png
            .tmp/ios-tour-ipad/*.png
            .tmp/ios-tour-ipad/app-console.log
            ios-tour-build.log
          retention-days: 30
          if-no-files-found: warn

  # The release path: archive, export and upload to TestFlight (testflight-release.yml, shared with the other two apps).
  #
  # It stays dormant until the account exists — every step that needs a secret checks for it first and
  # says what is missing (docs/IOS_ACCOUNT_DAY.md).
  #
  # An IPA is made only when someone will send it: dg-ios / dg-both / a Dhamma.Gift tag send it to TestFlight
  # here, keep_ipa keeps it as an artifact for ios-upload.yml (owner, 2026-10-01: "чтобы можно было Apple
  # существующую сборку отправить, а не новую собирать"). It used to be made on every manual run —
  # a macOS job and an Apple certificate created and revoked each time for a build nobody asked for.
  # Every manual run used to upload unconditionally before that, too (owner, 2026-09-20: a manual run must
  # not release). One switch rather than two booleans, and it names a store rather than saying yes:
  # retrying one store must not disturb the other (owner: "жди эпл, не перезаливай").
  #
  # Waits for the iOS checks (ios-build, ios-ui), which run whenever this job does: nothing reaches
  # TestFlight, now or later through ios-upload.yml, without them (verified 2026-10-10: all four DG
  # TestFlight uploads since 2026-10-01 went with the checks skipped).
  ios-release:
    name: iOS archive (IPA; TestFlight on release)
    needs: [plan, unit, build, ios-build, ios-ui]
    if: needs.plan.outputs.dg_ios_archive == 'true'
    uses: ./.github/workflows/testflight-release.yml
    with:
      app: dg
      build_number: ${{ needs.plan.outputs.dg_number }}
      upload: ${{ needs.plan.outputs.dg_ios == 'true' }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
