# Pages of the live site in the iOS Simulator's own Safari: the same WebKit as the apps' WKWebView on a phone,
# which Playwright's WebKit (webkit-probe.yml) is not — it laid the settings sheet out right while every iPhone
# showed it wider than the screen. No app build: a page fix on test.dhamma.gift is checked in minutes.
# One screenshot per URL (urls: space-separated), each after `wait` seconds.
name: iOS Safari probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to open in Safari, one screenshot each
        default: https://test.dhamma.gift/settings/
      wait:
        description: Seconds to wait after opening each URL
        default: '12'
      appearance:
        description: light or dark
        default: dark
      app_run:
        description: 'Also run Dhamma.Gift itself: the build-app run ID whose dg-app-ios-simulator artifact to install (debug build; empty = Safari only)'
        default: ''
      app_urls:
        description: Space-separated dhammagift:// links to open in the app, one screenshot each (plus the page's selftest.json)
        default: 'dhammagift://route/?q=kacchapa#dg-settings'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: tools/select-xcode.sh
      - name: Boot an iPhone and open the pages
        env:
          URLS: ${{ inputs.urls }}
          WAIT: ${{ inputs.wait }}
          APPEARANCE: ${{ inputs.appearance }}
        run: |
          set -euo pipefail
          mkdir -p out
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -n "$UDID" ] || { xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance "$APPEARANCE"
          n=0
          for u in $URLS; do
            n=$((n + 1))
            xcrun simctl openurl "$UDID" "$u"
            sleep "$WAIT"
            xcrun simctl io "$UDID" screenshot "out/$n.png"
            echo "$n $u" >> out/index.txt
          done
      - name: Download the app
        if: inputs.app_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: dg-app-ios-simulator-*
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}
          path: app
      # The debug app, launched twice: the first start may fetch the site's newer pages (a signed update from
      # online_origin, src/site-updater.js), the second runs them. Then each link, a screenshot, and what the page
      # wrote through DgSelfTest (selftest.json) after it.
      - name: Open the app's pages
        if: inputs.app_run != ''
        env:
          APP_URLS: ${{ inputs.app_urls }}
          WAIT: ${{ inputs.wait }}
        run: |
          set -uo pipefail
          APP=$(find app -name App.app -maxdepth 3 | head -1)
          [ -n "$APP" ] || { find app -maxdepth 3; exit 1; }
          UDID=$(xcrun simctl list devices booted | grep -o '[0-9A-F-]\{36\}' | head -1)
          xcrun simctl terminate "$UDID" com.apple.mobilesafari || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" gift.dhamma.mobile; sleep 40
          xcrun simctl terminate "$UDID" gift.dhamma.mobile || true
          xcrun simctl launch "$UDID" gift.dhamma.mobile; sleep 20
          DATA=$(xcrun simctl get_app_container "$UDID" gift.dhamma.mobile data)
          n=0
          for u in $APP_URLS; do
            n=$((n + 1))
            rm -f "$DATA/Documents/selftest.json"
            xcrun simctl openurl "$UDID" "$u"
            sleep "$WAIT"
            xcrun simctl io "$UDID" screenshot "out/app-$n.png"
            cp "$DATA/Documents/selftest.json" "out/app-$n.json" 2>/dev/null || echo "no selftest.json for $u"
            echo "app-$n $u" >> out/index.txt
            cat "out/app-$n.json" 2>/dev/null; echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-safari-probe
          path: out
