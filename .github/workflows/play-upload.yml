# Upload an AAB that an earlier Build App run already made, instead of building again (owner,
# 2026-09-30: "всё собрано, потестили — нажимаем отправить", not a new build with the next number).
# The bytes that go to Play are exactly the ones the owner and the emulator tests had; versionCode is
# that run's number. Only on the owner's explicit yes (CLAUDE.md), and never to production.
name: Play upload

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'build-app.yml run id whose AAB to upload'
        required: true
        type: string
      app:
        description: 'dg, dict or uposatha (all -> alpha, closed testing), as build-app.yml does'
        required: false
        type: choice
        options: [dg, dict, uposatha]
        default: dg

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools

      - name: Which app
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            dg)       echo "prefix=dg-app-full-aab-release" >> "$GITHUB_OUTPUT"; echo "pkg=gift.dhamma.twa" >> "$GITHUB_OUTPUT"; echo "check=Android emulator tests" >> "$GITHUB_OUTPUT" ;;
            dict)     echo "prefix=dg-dict-aab-release" >> "$GITHUB_OUTPUT"; echo "pkg=gift.dhamma.pali" >> "$GITHUB_OUTPUT"; echo "check=Dictionary app launch check" >> "$GITHUB_OUTPUT" ;;
            uposatha) echo "prefix=dg-uposatha-aab-release" >> "$GITHUB_OUTPUT"; echo "pkg=gift.dhamma.uposatha" >> "$GITHUB_OUTPUT"; echo "check=Uposatha app launch check" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "track=alpha" >> "$GITHUB_OUTPUT"

      # The same rule build-app.yml applies to its own uploads: a run that succeeded, from main or a tag,
      # talking to https://dhamma.gift, with this app's emulator check passed (tools/check-build-run.sh).
      - name: Is that run one a store may get?
        id: run
        env:
          RUN_ID: ${{ inputs.build_run_id }}
          CHECK: ${{ steps.app.outputs.check }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/check-build-run.sh "$RUN_ID" "$CHECK"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.app.outputs.prefix }}-${{ steps.run.outputs.run_number }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.app.outputs.pkg }}
          releaseFiles: aab/*.aab
          track: ${{ steps.app.outputs.track }}
          status: completed

      - name: Summary
        env:
          N: ${{ steps.run.outputs.run_number }}
          TRACK: ${{ steps.app.outputs.track }}
          PKG: ${{ steps.app.outputs.pkg }}
        run: echo "### versionCode $N -> $TRACK of $PKG" >> "$GITHUB_STEP_SUMMARY"
