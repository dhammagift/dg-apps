name: Uposatha widget on Windows 11 (Widgets Board)

# A probe, started by hand: a Windows 11 runner installs the Uposatha PWA into Edge by policy, opens the Widgets Board and tries to
# add the widget (uposatha/test/windows/widget-board.ps1). Screenshots and the element trees of every step are the result; the job
# itself fails nothing. Nothing is built or uploaded: the PWA is the live page.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'The page to install as an app'
        required: false
        type: string
        default: 'https://test.dhamma.gift/uposatha-calendar?app=1&source=pwa'
      only:
        description: 'Pin only this widget of ours (0 Uposatha, 1 Day & night, 2 Month); -1 = all three'
        required: false
        type: string
        default: '-1'
      size:
        description: 'Change our pinned widget to this size (Small, Medium, Large); asis = as pinned'
        required: false
        type: string
        default: 'asis'
      theme:
        description: 'dark = switch Windows to the dark theme first; light = as it is'
        required: false
        type: string
        default: 'light'
      package:
        description: 'A PWABuilder Windows package (zip with *.sideload.msix and utils/pwainstaller.exe) to install instead of the PWA; none = the PWA from the page'
        required: false
        type: string
        default: 'none'
      jump:
        description: 'relaunch = the packaged app is closed and opened again and its taskbar menu is pictured a second time; no = once'
        required: false
        type: string
        default: 'no'

concurrency:
  group: uposatha-widget-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  board:
    name: Widgets Board
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the PWA, open the board, add the widget
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./uposatha/test/windows/widget-board.ps1 -Url '${{ inputs.url }}' -Out win-shots -Package '${{ inputs.package }}' -Only ${{ inputs.only }} -Size '${{ inputs.size }}' -Theme '${{ inputs.theme }}' -Jump '${{ inputs.jump }}'

      - name: Upload the screenshots and the trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uposatha-widget-windows-${{ github.run_number }}
          path: win-shots
          retention-days: 14
          if-no-files-found: ignore
