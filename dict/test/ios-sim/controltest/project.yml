# A UI-test bundle with no host app (the shape of widgettest): it drives SpringBoard, the only thing that shows a
# Control Center control. Opens Control Center, its "Add a Control" gallery, finds the Dict.Dhamma.Gift control, adds
# it, and taps it to confirm it opens the app. Generated by xcodegen in CI, driven by control-gallery.sh.
name: ControlTests
options:
  bundleIdPrefix: gift.dhamma.tests
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  ControlTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: gift.dhamma.tests.control
schemes:
  ControlTests:
    build:
      targets:
        ControlTests: all
    test:
      targets: [ControlTests]
