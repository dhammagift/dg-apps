# The Dictionary's feature tour on an iOS simulator: a UI-test bundle with no host app, driving the installed
# Dict.Dhamma.Gift (gift.dhamma.pali) the way a thumb does - taps, typing, scrolling with the keyboard up, a pull to
# refresh, the Home Screen quick actions. Generated by xcodegen in CI (build-app.yml, job dict-ios-tour), run one test
# at a time by test/ios-sim/feature-tour.sh, which records a video of each and judges the screenshots.
name: DictFeatureTests
options:
  bundleIdPrefix: gift.dhamma.tests
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DictFeatureTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: gift.dhamma.tests.dictfeatures
schemes:
  DictFeatureTests:
    build:
      targets:
        DictFeatureTests: all
    test:
      targets: [DictFeatureTests]
