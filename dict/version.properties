# The dictionary's version, the one people see: Android's versionName, and iOS's MARKETING_VERSION unless `ios` is set.
# dict/android/app/build.gradle reads it, CI passes it to xcodebuild.
# 2.0.1 in both stores (2026-11-07): Apple closed iOS 1.0 to new builds once it went on sale ("train 1.0 closed",
# dictionary TestFlight run 700); iOS was 1.0, Android 2.0.0 until then.
version=2.0.1
# build_floor: build numbers up to here are taken (until 2026-10-11 all three apps used the CI run number, up to 560).
# This app's build number is max(build_floor, its highest code in Play, its highest build in TestFlight) + 1,
# worked out per run by .github/scripts/build_numbers.py: its own counter, not shared with the other two apps.
build_floor=560
