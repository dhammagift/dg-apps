# The dictionary's version, the one people see: Android's versionName, and iOS's MARKETING_VERSION unless `ios` is set.
# dict/android/app/build.gradle reads it, CI passes it to xcodebuild. The build number is the CI run number.
version=2.0.0
# iOS has been 1.0 so far, Android 2.0.0. Kept as they are (no bump in passing); the next version raise sets `version`
# and deletes this line, so both stores carry one number from then on.
ios=1.0
