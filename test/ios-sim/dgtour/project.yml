# Dhamma.Gift's video tour on an iOS simulator: a UI-test bundle with no host app, driving the installed
# Dhamma.Gift (gift.dhamma.mobile) — search, the reader, pull to refresh, Settings, light then dark. Generated by
# xcodegen in CI (build-app.yml, job ios-ui, step "Video tour"), run by tour.sh, which records the simulator's screen
# around it (dg-tour.mp4). For a person to look at: edge to edge, nothing under the clock or the home indicator.
name: DgTourTests
options:
  bundleIdPrefix: gift.dhamma.tests
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DgTourTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: gift.dhamma.tests.dgtour
schemes:
  DgTourTests:
    build:
      targets:
        DgTourTests: all
    test:
      targets: [DgTourTests]
