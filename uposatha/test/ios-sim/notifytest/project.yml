# The Uposatha reminders as iOS delivers them (owner 2026-10-30: no notification on an iPhone 8, iOS 16, not even the test one;
# no check in CI covered notifications at all). A UI-test bundle with no host app of its own, like rotatetest and widgettest;
# generated by xcodegen in CI, driven by notify.sh.
name: NotifyTests
options:
  bundleIdPrefix: gift.dhamma.tests
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NotifyTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: gift.dhamma.tests.notify
schemes:
  NotifyTests:
    build:
      targets:
        NotifyTests: all
    test:
      targets: [NotifyTests]
