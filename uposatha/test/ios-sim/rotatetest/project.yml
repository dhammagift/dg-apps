# A UI-test bundle with no host app of its own: its one job is rotating the booted simulator
# (XCUIDevice.orientation), which `simctl` cannot do — screenshots, video and the light/dark
# appearance, yes; rotation, no. Same shape as the reader app's sharetest (test/ios-sim/sharetest);
# generated by xcodegen in CI (build-app.yml, job uposatha-ios), driven by tools/ios-edgetoedge.sh.
name: RotateTests
options:
  bundleIdPrefix: gift.dhamma.tests
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  RotateTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: gift.dhamma.tests.rotate
schemes:
  RotateTests:
    build:
      targets:
        RotateTests: all
    test:
      targets: [RotateTests]
