# A UI-test bundle with no host app of its own (the shape of rotatetest): it drives SpringBoard, which is the only thing that
# can show a widget. Opens the widget gallery, finds Uposatha, pictures every preview, adds one to the Home Screen.
# Generated by xcodegen in CI (uposatha-widget-ios.yml), driven by uposatha/test/ios-sim/widget-gallery.sh.
name: WidgetTests
options:
  bundleIdPrefix: gift.dhamma.tests
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  WidgetTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: gift.dhamma.tests.widget
schemes:
  WidgetTests:
    build:
      targets:
        WidgetTests: all
    test:
      targets: [WidgetTests]
