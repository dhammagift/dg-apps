# Uposatha's version, the one people see: Android's versionName, and iOS's MARKETING_VERSION unless `ios` is set.
# uposatha/android/app/build.gradle reads it, CI passes it to xcodebuild. The build number is the CI run number.
version=1.0.0
# The App Store version record is "1.0" (the screenshots go to it); kept as it is. The next version raise sets `version`
# and deletes this line, so both stores carry one number from then on.
ios=1.0
