# Dhamma.Gift's version, the one people see: Android's versionName and iOS's MARKETING_VERSION (CFBundleShortVersionString).
# The only place it is written: android/app/build.gradle reads it, CI passes it to xcodebuild, build-assets.js shows it in the app.
# Raise it before a release whose version the App Store has already
# approved (Apple closes an approved version to new builds: 1.18, 2026-10-07).
version=1.19
# build_floor: build numbers up to here are taken (until 2026-10-11 all three apps used the CI run number, up to 560).
# This app's build number is max(build_floor, its highest code in Play, its highest build in TestFlight) + 1,
# worked out per run by .github/scripts/build_numbers.py: its own counter, not shared with the other two apps.
build_floor=560
